# Arma la app de Android (APK para probar) en cada cambio a main que toque la app,
# o a mano desde Actions → "App Android" → Run workflow.
# El APK queda para descargar en la ejecución, sección "Artifacts" (gize-android-debug).
name: App Android

on:
  push:
    branches: [main]
    paths: ["manifest.json", "install.js", "app/**", "css/**", "brand/**", "vendor/**", "android/**", "capacitor.config.json", "package.json", "scripts/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "capacitor.config.json", "package.json", "scripts/**", ".github/workflows/android.yml"]
  workflow_dispatch:

# El token de GitHub de la ejecución solo puede leer el repo.
permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependencias
        run: npm ci
      - name: Juntar la app web y pasarla al proyecto Android
        run: npm run android
      - name: Compilar APK de prueba
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gize-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
