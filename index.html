  if(a==="save-routine"){ b.textContent="Guardando..."; (async()=>{ try{ const r=await sb.from("routines").upsert({client_id:coachSel, days:coachData.routine, updated_at:new Date().toISOString(), updated_by:cloudUser.id},{onConflict:"client_id"}); if(r.error) throw r.error; alert("Rutina guardada. El cliente la va a ver al abrir la app."); }catch(err){ alert("No se pudo guardar: "+((err&&err.message)||err)); } renderCoach(); })(); return; }
});
document.body.addEventListener("change", async e => {
  const el=e.target.closest("[data-coach]"); if(!el||!coachData) return;
  const a=el.dataset.coach;
  if(a==="ex"){ coachData.loadEx=el.value; renderCoach(); }
  else if(a==="dayfilter"){ coachDayFilter=el.value||null; coachData.loadEx=null; renderCoach(); }
});
document.body.addEventListener("input", async e => {
  const el=e.target.closest("[data-coach]"); if(!el) return;
  const a0=el.dataset.coach;
  if(a0==="tpl-name"){ if(coachTplEdit) coachTplEdit.name=el.value; return; }
  if(a0==="coach-search"){ coachSearch=el.value; renderCoach(); return; }
  if(!rtDays()) return;
  const a=a0; const day=(rtDays()||[])[coachEditDay]; if(!day) return;
  if(a==="rt-name"){ if(day.exercises[+el.dataset.i]) day.exercises[+el.dataset.i].name=el.value; }
  else if(a==="day-name"){ day.name=el.value; }
  else if(a==="rt-target"){ const ex=day.exercises[+el.dataset.i]; const st=ex&&ex.sets[+el.dataset.j]; if(st){ const v=el.value.trim(); if(v) st.target=v; else delete st.target; } }
  else if(a==="rt-note"){ const ex=day.exercises[+el.dataset.i]; if(ex){ const v=el.value.trim(); if(v) ex.note=v; else delete ex.note; } }
  else if(a==="day-note"){ const v=el.value.trim(); if(v) day.note=v; else delete day.note; }
  else if(a==="rt-o"||a==="rt-rir"||a==="rt-rest"||a==="rt-goal"||a==="rt-video"){ const ex=day.exercises[+el.dataset.i]; if(ex){ const k=(a==="rt-video")?"video":a.slice(3); const v=el.value.trim(); if(v) ex[k]=v; else delete ex[k]; } }
  else if(a.indexOf("info-")===0){ coachInfoForm = coachInfoForm || Object.assign({}, coachData.info||{}); coachInfoForm[a.slice(5)] = el.value; return; }
  else if(a.indexOf("blk-")===0){ coachBlockForm = coachBlockForm || Object.assign({}, coachData.block||{}); coachBlockForm[a.slice(4)] = el.value; return; }
  else if(a==="plan-kcal"||a==="plan-protein"||a==="plan-carbs"||a==="plan-fat"||a==="plan-notes"){ coachPlanForm = coachPlanForm || Object.assign({}, coachData.plan||{}); coachPlanForm[a.slice(5)] = el.value; }
  else if(a==="pl-meal"){ const p=coachPlanObj(coachData); const r=p[el.dataset.key][+el.dataset.i]; if(r) r[el.dataset.k]=el.value; }
  else if(a==="pl-list"){ const p=coachPlanObj(coachData); p[el.dataset.key][+el.dataset.i]=el.value; }
  else if(a==="pl-water"){ coachPlanObj(coachData).water=el.value; }
  else if(a==="pl-salt"){ coachPlanObj(coachData).salt=el.value; }
  else if(a==="pl-optsec"){ const p=coachPlanObj(coachData); p.options[+el.dataset.i].title=el.value; }
  else if(a==="pl-optlabel"){ const p=coachPlanObj(coachData); p.options[+el.dataset.i].opts[+el.dataset.j].label=el.value; }
  else if(a==="pl-optbody"){ const p=coachPlanObj(coachData); p.options[+el.dataset.i].opts[+el.dataset.j].body=el.value; }
  else if(a==="pl-swap"){ const p=coachPlanObj(coachData); p.swaps[+el.dataset.i][el.dataset.k]=el.value; }
  else if(a==="pl-cardiotext"){ const p=coachPlanObj(coachData); p.cardio=p.cardio||{text:"",items:[]}; p.cardio.text=el.value; }
  else if(a==="pl-cardioitem"){ const p=coachPlanObj(coachData); p.cardio.items[+el.dataset.i]=el.value; }
  else if(a==="pl-habit"){ const p=coachPlanObj(coachData); p.habits[+el.dataset.i]=el.value; }
});

document.addEventListener("visibilitychange", async ()=>{
  if(document.visibilityState!=="visible" || !sb || !cloudUser || !routineLocked()) return;
  try{
    const rt=await sb.from("routines").select("days").eq("client_id",cloudUser.id).maybeSingle();
    if(rt.data && Array.isArray(rt.data.days) && rt.data.days.length){
      state.days=rt.data.days;
      if(!state.days.find(x=>x.id===activeId)) activeId=state.days[0].id;
      renderApp();
    }
  }catch(e){}
});

async function cloudBoot(){
  if(!sb){ renderApp(); return; }
  try{
    const sess=await sb.auth.getSession();
    if(sess.data.session){ await afterLogin(); }
    else { showLogin("","in"); }
  }catch(e){ renderApp(); }
}

if (migrateNames(state.days)) save();
cloudBoot();
if ("serviceWorker" in navigator) { window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(()=>{}); }); }
</script>

<!--
  ===========================================================================
  ADD-ON: sección de Configuración para FitSheet (index.html)
  ===========================================================================
  Qué hace: agrega un 6to botón "Ajustes" a la barra de navegación inferior,
  con su propia vista (cuenta, cerrar sesión, vincular coach, borrar datos
  locales). No toca ni una línea del index.html existente: se engancha por
  fuera, reutilizando las funciones y variables globales que ya existen
  (view, renderApp, cloudUser, cloudProfile, sb, esc, showLogin, KEY) y los
  listeners delegados que ya manejan data-view / data-auth="logout" /
  data-auth="join".

  Fix aplicado sobre el original: `.cfg-card { opacity:1; transform:none; }`
  al final del <style> — sin esto las cajas heredaban el atenuado propio de
  `.card` (opacity:.45/scale:.90), pensado para el foco de scroll de Entreno,
  y quedaban lavadas para siempre porque ese observer nunca corre en esta
  vista. Confirmado en vivo con Playwright antes de pegarlo acá.

  NOTA: el botón "Cerrar sesión" y el cuadro de "Vincular coach" que ya
  existen al final de la pestaña Progreso siguen ahí (no los borré porque
  eso implicaría editar renderProgreso()). Vas a tener acceso a esas mismas
  acciones desde dos lugares hasta que decidas sacarlos de Progreso.
  ===========================================================================
-->
<style id="cfg-addon-styles">
  .cfg-card { display:flex; flex-direction:column; gap:12px; }
  .cfg-row { display:flex; align-items:center; gap:12px; }
  .cfg-avatar {
    width:42px; height:42px; border-radius:50%; flex-shrink:0;
    background:var(--card-2); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:16px; color:var(--blue-2);
  }
  .cfg-who { flex:1; min-width:0; }
  .cfg-name { font-size:var(--text-emphasis); font-weight:700; color:var(--txt); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cfg-email { font-size:var(--text-meta); color:var(--txt-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cfg-badge {
    flex-shrink:0; font-size:var(--text-meta); font-weight:700; color:var(--blue-2);
    background:var(--card-2); border:1px solid var(--border); border-radius:3px;
    padding:4px 9px;
  }
  .cfg-empty { color:var(--txt-2); font-size:var(--text-body); text-align:center; padding:6px 0; }
  .cfg-row-simple { display:flex; align-items:center; justify-content:space-between; font-size:var(--text-body); color:var(--txt); }
  /* .cfg-ok ahora es un <button> (antes era un <span> puramente informativo) para poder
     desvincularse del coach con un solo click — reseteo el chrome nativo de botón para
     que en reposo se vea IDÉNTICO al texto de antes, y solo con :hover insinúo que es
     una acción (se tiñe de rojo apagado, mismo tono que ya usa .cfg-danger más abajo
     para "Borrar datos"), sin agregar ningún elemento visual nuevo a la pantalla. */
  .cfg-ok { background:none; border:none; padding:0; font:inherit; cursor:pointer;
    color:var(--blue-2); font-weight:700; font-size:var(--text-meta); transition:color .15s ease; }
  .cfg-ok:hover { color:#e08a80; }
  .cfg-sub { font-size:var(--text-meta); color:var(--txt-2); font-weight:600; margin-bottom:2px; }
  .cfg-about { text-align:center; color:var(--txt-3); font-size:var(--text-meta); margin-top:4px; padding-bottom:8px; }
  .cfg-danger { border-color:rgba(192,57,43,.35) !important; color:#e08a80 !important; }
  /* Fix: .card trae opacity:.45/scale:.90 por defecto (pensado para el foco de
     scroll de Entreno, ver .ex-focused) y acá nunca se activa. Misma especificidad
     que .card pero definida después → gana en la cascada sin !important. */
  .cfg-card { opacity: 1; transform: none;
    transition: transform var(--duration-standard) var(--ease-drawer),
                border-color var(--duration-standard) ease,
                box-shadow var(--duration-standard) ease;
  }
  /* Elevación + iluminación de borde al pasar el cursor — mismo verde de marca
     que ya usan el borde y el glow de las cajas (--glow, --border en modo silk-on),
     así queda del mismo lenguaje visual en vez de un efecto ajeno a la estética. */
  .cfg-card:hover { transform: translateY(-2px); border-color: rgba(127,224,168,.5);
    box-shadow: var(--shadow-card), 0 0 16px var(--glow); }
  @media (prefers-reduced-motion: reduce) {
    .cfg-card:hover { transform: none; }
  }
</style>

<script id="cfg-addon-script">
(function(){
  if (window.__cfgAddonInstalled) return;
  window.__cfgAddonInstalled = true;

  // ---- 1. Botón "Ajustes" en la barra inferior ----
  function injectNavButton(){
    var navInner = document.querySelector(".navbar .nav-inner");
    if (!navInner || document.getElementById("nav-config")) return;
    var btn = document.createElement("button");
    btn.className = "nav-item";
    btn.id = "nav-config";
    btn.setAttribute("data-view", "config");
    btn.innerHTML =
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
      '<circle cx="12" cy="12" r="3"/>' +
      '<path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82A1.65 1.65 0 0 0 3 13.09H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>' +
      '</svg><span>Ajustes</span>';
    navInner.appendChild(btn);
  }
  injectNavButton();

  // ---- 2. Vista de Configuración ----
  function cfgRoleLabel(p){ return (p && p.role === "coach") ? "Coach" : "Cliente"; }

  function renderConfig(){
    var logged = typeof cloudUser !== "undefined" && !!cloudUser;
    var profile = (typeof cloudProfile !== "undefined") ? cloudProfile : null;
    var name = (profile && profile.full_name) || (logged && cloudUser.email) || "";
    var email = logged ? cloudUser.email : "";
    var initial = (name || "?").trim().charAt(0).toUpperCase();

    var account = logged
      ? '<div class="card cfg-card">' +
          '<div class="cfg-row">' +
            '<div class="cfg-avatar">' + esc(initial) + '</div>' +
            '<div class="cfg-who">' +
              '<div class="cfg-name">' + esc(name || "Sin nombre") + '</div>' +
              '<div class="cfg-email">' + esc(email) + '</div>' +
            '</div>' +
            (profile ? '<div class="cfg-badge">' + esc(cfgRoleLabel(profile)) + '</div>' : '') +
          '</div>' +
          '<button class="logout-btn" data-auth="logout">Cerrar sesión</button>' +
        '</div>'
      : '<div class="card cfg-card">' +
          '<div class="cfg-empty">No iniciaste sesión.</div>' +
          '<button class="form-save" data-action="cfg-login">Iniciar sesión</button>' +
        '</div>';

    var needsLink = logged && profile && profile.role !== "coach" && !profile.coach_id;
    var linked = logged && profile && profile.role !== "coach" && !!profile.coach_id;

    var coachSection = !logged ? "" :
      linked
        ? '<div class="card cfg-card"><div class="cfg-row-simple"><span>Tu coach</span><button class="cfg-ok" data-action="cfg-unlink-coach" title="Desvincularte de tu coach">Vinculado ✅</button></div></div>'
        : needsLink
          ? '<div class="join-box" style="margin-top:0">' +
              '<div class="join-t">Vinculate a tu coach</div>' +
              '<input id="joinCode" class="form-input" placeholder="Código del coach" style="margin-bottom:10px">' +
              '<button class="form-save" data-auth="join" style="margin-top:0">Vincular</button>' +
            '</div>'
          : "";

    var dataSection = '<div class="card cfg-card">' +
        '<div class="cfg-sub">Datos en este dispositivo</div>' +
        '<button class="logout-btn cfg-danger" data-action="cfg-clear-local">Borrar datos guardados localmente</button>' +
      '</div>';

    var about = '<div class="cfg-about">FitSheet</div>';

    return '<div class="hb-head"><div class="hb-title">Configuración</div><div class="title-accent"></div></div>' +
      account + coachSection + dataSection + about;
  }

  // ---- 3. Enganche con renderApp (sin tocar el original) ----
  function installRenderHook(){
    if (typeof renderApp !== "function" || window.__cfgRenderHooked) return false;
    window.__cfgRenderHooked = true;
    var originalRenderApp = renderApp;
    renderApp = function(){
      if (typeof view !== "undefined" && view === "config") {
        ["entreno","habitos","cardio","comida","progreso"].forEach(function(k){
          var b = document.getElementById("nav-" + k);
          if (b) b.classList.remove("active");
        });
        var cfgBtn = document.getElementById("nav-config");
        if (cfgBtn) cfgBtn.classList.add("active");
        var v = document.getElementById("view");
        if (v) v.innerHTML = renderConfig();
        var sh = document.getElementById("sheetHost");
        if (sh) sh.innerHTML = "";
        return;
      }
      originalRenderApp();
      // originalRenderApp() solo togglea los 5 botones que ya conocía al escribirse
      // (no sabe que nav-config existe), así que si veníamos de Ajustes y navegamos
      // a otra pestaña, su clase "active" nunca se sacaba y quedaba pegada en verde
      // para siempre. La sacamos acá explícitamente cada vez que NO estamos en config.
      var cfgBtnOff = document.getElementById("nav-config");
      if (cfgBtnOff) cfgBtnOff.classList.remove("active");
    };
    return true;
  }
  if (!installRenderHook()) {
    // Si este bloque se pegara antes de que exista renderApp, reintenta al cargar.
    window.addEventListener("load", installRenderHook);
  }

  // ---- 4. Acciones propias de esta sección ----
  document.body.addEventListener("click", async function(e){
    var loginBtn = e.target.closest('[data-action="cfg-login"]');
    if (loginBtn) {
      if (typeof showLogin === "function") showLogin("", "in");
      return;
    }
    var unlinkBtn = e.target.closest('[data-action="cfg-unlink-coach"]');
    if (unlinkBtn) {
      if (!confirm("¿Seguro que te querés desvincular de tu coach? Vas a necesitar su código de invitación de nuevo si te querés volver a vincular.")) return;
      var prevHtml = unlinkBtn.innerHTML;
      unlinkBtn.disabled = true; unlinkBtn.innerHTML = "Desvinculando…";
      try {
        var r = await sb.from("profiles").update({coach_id: null}).eq("id", cloudUser.id);
        if (r.error) throw r.error;
        if (typeof loadCloud === "function") await loadCloud();
        else cloudProfile.coach_id = null;
        renderApp();
      } catch (err) {
        alert("No se pudo desvincular: " + ((err && err.message) || err));
        unlinkBtn.disabled = false; unlinkBtn.innerHTML = prevHtml;
      }
      return;
    }
    var clearBtn = e.target.closest('[data-action="cfg-clear-local"]');
    if (clearBtn) {
      if (confirm("¿Seguro? Se va a borrar todo lo guardado en este dispositivo (rutinas, pesos, hábitos). Esta acción no se puede deshacer.")) {
        try { if (typeof KEY !== "undefined") localStorage.removeItem(KEY); } catch (err) {}
        location.reload();
      }
      return;
    }
  });
})();
</script>
