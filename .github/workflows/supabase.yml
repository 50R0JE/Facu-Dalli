# Tareas de Supabase sin entrar al panel: publicar funciones, cargar secrets, correr SQL
# y crear las cuentas demo para la revisión de Google Play.
# Se corre a mano: Actions → "Supabase" → Run workflow → elegir la tarea.
#
# Secrets del repo (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  obligatorio. Token de supabase.com/dashboard/account/tokens con
#                          acceso SOLO a este proyecto: Project Settings (read), Logs (read),
#                          Database (read-write), Edge Functions (read-write),
#                          Edge Function Secrets (read-write), Auth Config (read-write).
#   MP_ACCESS_TOKEN        opcional. Access Token de producción de Mercado Pago (tarea "secrets").
#   SMTP_PASSWORD          opcional. Contraseña de aplicación de Gmail (tarea "mails").
#   RESEND_API_KEY         opcional. Clave de Resend ("Sending access") para los avisos de pagos
#                          a los socios (tarea "secrets").
#   AVISOS_PAGOS           opcional. Mails que reciben los avisos de pagos, separados por coma.
#   DEMO_PASSWORD          para "cuentas-demo". Contraseña de las cuentas demo de Google Play.
#                          Va como secret y no como dato del formulario: el repo es público y
#                          los datos del formulario quedan escritos en el log de la ejecución.
name: Supabase

on:
  workflow_dispatch:
    inputs:
      tarea:
        description: "Qué hacer"
        type: choice
        required: true
        options:
          - funciones
          - secrets
          - sql
          - cuentas-demo
          - mails
          - plantillas
      archivo:
        description: "Para 'sql': archivo a correr (ej: supabase/suscripciones.sql)"
        required: false
        default: ""
      smtp_user:
        description: "Para 'mails': Gmail que manda los mails (ej: tu-mail@gmail.com)"
        required: false
        default: ""

# El token de GitHub de la ejecución solo puede leer el repo.
permissions:
  contents: read

env:
  PROJECT_REF: wegptuzhsrwppbknqstf
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

jobs:
  supabase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Revisar el token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::error::Falta el secret SUPABASE_ACCESS_TOKEN"; exit 1; fi

      - uses: supabase/setup-cli@v1
        if: inputs.tarea == 'funciones' || inputs.tarea == 'secrets'
        with:
          version: latest

      # La app llama a la función de mensajes "rapid-worker" (el nombre que le puso
      # Supabase al crearla desde el panel); el código es el de notificar-cliente.
      # Las dos van sin "Verify JWT": suscripcion recibe los avisos de Mercado Pago sin
      # sesión, y las dos validan al usuario por su cuenta con auth.getUser().
      - name: Publicar funciones
        if: inputs.tarea == 'funciones'
        run: |
          cp -r supabase/functions/notificar-cliente supabase/functions/rapid-worker
          for fn in rapid-worker suscripcion descanso; do
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF" --no-verify-jwt --use-api
          done

      - name: Cargar secrets de las funciones
        if: inputs.tarea == 'secrets'
        env:
          MP_ACCESS_TOKEN: ${{ secrets.MP_ACCESS_TOKEN }}
          APNS_KEY_P8: ${{ secrets.APNS_KEY_P8 }}
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          AVISOS_PAGOS: ${{ secrets.AVISOS_PAGOS }}
        run: |
          # Se cargan los que estén en GitHub: Mercado Pago y, para la app de iPhone, la clave de Apple.
          set -- 
          [ -n "$MP_ACCESS_TOKEN" ] && set -- "$@" MP_ACCESS_TOKEN="$MP_ACCESS_TOKEN"
          [ -n "$APNS_KEY_P8" ] && set -- "$@" APNS_KEY_P8="$APNS_KEY_P8" APNS_KEY_ID="$APNS_KEY_ID" APPLE_TEAM_ID="$APPLE_TEAM_ID"
          [ -n "$RESEND_API_KEY" ] && set -- "$@" RESEND_API_KEY="$RESEND_API_KEY"
          [ -n "$AVISOS_PAGOS" ] && set -- "$@" AVISOS_PAGOS="$AVISOS_PAGOS"
          if [ $# -eq 0 ]; then echo "::error::No hay secrets para cargar (MP_ACCESS_TOKEN o APNS_KEY_P8)"; exit 1; fi
          supabase secrets set --project-ref "$PROJECT_REF" "$@"
          supabase secrets list --project-ref "$PROJECT_REF"

      - name: Correr SQL
        if: inputs.tarea == 'sql' || inputs.tarea == 'cuentas-demo'
        env:
          ARCHIVO: ${{ inputs.archivo }}
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
        run: |
          if [ "${{ inputs.tarea }}" = "cuentas-demo" ]; then
            if [ ${#DEMO_PASSWORD} -lt 8 ]; then echo "::error::Falta el secret DEMO_PASSWORD (al menos 8 caracteres)"; exit 1; fi
            echo "::add-mask::$DEMO_PASSWORD"
            python3 -c 'import os,sys; pw=os.environ["DEMO_PASSWORD"].replace("\x27","\x27\x27"); sys.stdout.write(open("supabase/cuentas-demo.sql").read().replace("__DEMO_PASSWORD__", pw))' > "$RUNNER_TEMP/q.sql"
          else
            case "$ARCHIVO" in supabase/*.sql) ;; *) echo "::error::El archivo tiene que ser supabase/<algo>.sql"; exit 1;; esac
            [ -f "$ARCHIVO" ] || { echo "::error::No existe $ARCHIVO"; exit 1; }
            cp "$ARCHIVO" "$RUNNER_TEMP/q.sql"
          fi
          jq -Rs '{query: .}' "$RUNNER_TEMP/q.sql" > "$RUNNER_TEMP/body.json"
          code=$(curl -sS -o "$RUNNER_TEMP/out.json" -w '%{http_code}' -X POST \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            --data @"$RUNNER_TEMP/body.json")
          cat "$RUNNER_TEMP/out.json"; echo
          [ "$code" -ge 200 ] && [ "$code" -lt 300 ] || { echo "::error::Supabase respondió $code"; exit 1; }

      # Textos de los mails (confirmar cuenta y contraseña nueva) desde supabase/mails/, sin
      # pegarlos a mano en el panel. Solo toca asunto y cuerpo: el SMTP queda como está.
      - name: Cargar plantillas de mails
        if: inputs.tarea == 'plantillas'
        run: |
          jq -n --rawfile conf supabase/mails/confirmacion.html --rawfile rec supabase/mails/recuperar.html '{
            mailer_subjects_confirmation: "Confirmá tu cuenta de GIZE",
            mailer_templates_confirmation_content: $conf,
            mailer_subjects_recovery: "Elegí una contraseña nueva para GIZE",
            mailer_templates_recovery_content: $rec
          }' > "$RUNNER_TEMP/auth.json"
          code=$(curl -sS -o "$RUNNER_TEMP/out.json" -w '%{http_code}' -X PATCH \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            --data @"$RUNNER_TEMP/auth.json")
          jq '{mailer_subjects_confirmation, mailer_subjects_recovery, confirmacion_chars: (.mailer_templates_confirmation_content|length), recuperar_chars: (.mailer_templates_recovery_content|length)}' "$RUNNER_TEMP/out.json" 2>/dev/null || cat "$RUNNER_TEMP/out.json"
          [ "$code" -ge 200 ] && [ "$code" -lt 300 ] || { echo "::error::Supabase respondió $code"; exit 1; }

      # Mails de registro por Gmail en vez del servidor de Supabase (que manda 2-3 por hora).
      - name: Configurar mails (SMTP de Gmail)
        if: inputs.tarea == 'mails'
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_USER: ${{ inputs.smtp_user }}
        run: |
          if [ -z "$SMTP_PASSWORD" ] || [ -z "$SMTP_USER" ]; then echo "::error::Faltan el secret SMTP_PASSWORD o el input smtp_user"; exit 1; fi
          jq -n --arg u "$SMTP_USER" --arg p "$SMTP_PASSWORD" '{
            external_email_enabled: true,
            smtp_host: "smtp.gmail.com", smtp_port: "465",
            smtp_user: $u, smtp_pass: $p, smtp_admin_email: $u, smtp_sender_name: "GIZE",
            rate_limit_email_sent: 100
          }' > "$RUNNER_TEMP/auth.json"
          code=$(curl -sS -o "$RUNNER_TEMP/out.json" -w '%{http_code}' -X PATCH \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            --data @"$RUNNER_TEMP/auth.json")
          jq '{external_email_enabled, smtp_host, smtp_user, rate_limit_email_sent}' "$RUNNER_TEMP/out.json" 2>/dev/null || cat "$RUNNER_TEMP/out.json"
          [ "$code" -ge 200 ] && [ "$code" -lt 300 ] || { echo "::error::Supabase respondió $code"; exit 1; }
