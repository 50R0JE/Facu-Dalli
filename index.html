<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #eef1ec; --card: #ffffff; --card-2: #f4f7f2; --border: #d8e0d5;
    --txt: #1e2b22; --txt-2: #566159; --txt-3: #8a948b;
    --blue: #217346; --blue-2: #1a7a44; --red: #c0392b;
    --green: #217346; --green-2: #33c481; --amber: #d4a017; --purple: #2e78b8; --pink: #c9662b; --cyan: #178a80;
    --glow: rgba(33,115,70,.18);
    --xl-head: #217346; --xl-band: #185c37;
  }
  input::placeholder, textarea::placeholder { color: var(--txt-3); opacity:.7; }
  html, body { background: linear-gradient(170deg, #f2f5ef 0%, #e8ede4 100%); background-attachment: fixed; color: var(--txt); }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif; min-height: 100vh; overflow-x: hidden; }
  body::before { content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: radial-gradient(720px circle at 50% -6%, rgba(33,115,70,.06), transparent 55%); }

  .topbar { position: relative; z-index: 1; display: flex; align-items: center; justify-content: space-between;
    max-width: 540px; margin: 0 auto; padding: calc(16px + env(safe-area-inset-top)) 16px 6px; }
  .brand { display: flex; align-items: center; gap: 11px; }
  .brand-ic { width: 40px; height: 40px; border-radius: 4px; background: linear-gradient(135deg, #185c37, #33c481);
    display: flex; align-items: center; justify-content: center; box-shadow: 0 0 20px var(--glow), inset 0 1px 0 rgba(255,255,255,.3); }
  .brand-ic svg { width: 22px; height: 22px; color: #fff; }
  .wordmark { font-family: "Orbitron", system-ui, sans-serif; font-weight: 800; font-size: 23px; letter-spacing: .02em; line-height: 1; }
  .wordmark .b { color: var(--blue);  }
  .wordmark .w { color: var(--txt); }
  .client-tag { text-align: right; line-height: 1.2; padding-left: 10px; }
  .client-name { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; font-weight: 600; color: var(--txt); letter-spacing: .01em; white-space: nowrap; }
  .client-sub { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 9.5px; font-weight: 500; color: var(--txt-3); text-transform: uppercase; letter-spacing: .16em; margin-top: 2px; }
  .top-btn { width: 38px; height: 38px; border-radius: 4px; background: var(--card); border: 1px solid var(--border);
    color: var(--txt-2); display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .top-btn svg { width: 18px; height: 18px; }
  .top-btn:active { color: var(--txt); }

  .view { position: relative; z-index: 1; max-width: 540px; margin: 0 auto; padding: 10px 16px calc(112px + env(safe-area-inset-bottom)); }

  .tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { padding: 8px 16px; border-radius: 4px; font-size: 14px; white-space: nowrap; flex-shrink: 0;
    background: var(--card); border: 1px solid var(--border); color: var(--txt-2); cursor: pointer; transition: .15s; }
  .tab.active { background: var(--blue); color: #fff; font-weight: 600; border-color: var(--blue); box-shadow: 0 0 16px var(--glow); }
  .tab-add { color: var(--blue-2); font-weight: 700; border-style: dashed; }

  .day-head { margin: 16px 0 20px; }
  .day-top { display: flex; align-items: center; gap: 8px; }
  .day-name { flex: 1; min-width: 0; background: transparent; border: none; color: var(--txt);
    font-size: 26px; font-weight: 700; letter-spacing: -0.02em; padding: 2px 4px; border-radius: 4px; }
  .day-name:focus { outline: none; background: var(--card); }
  .day-del { background: none; border: none; color: var(--txt-3); cursor: pointer; flex-shrink: 0; padding: 6px; }
  .day-del svg { width: 18px; height: 18px; }
  .day-del:active { color: var(--red); }
  .day-sub { width: 100%; background: transparent; border: none; color: var(--txt-2); font-size: 14px; padding: 2px 4px; border-radius: 4px; margin-top: 2px; }
  .day-sub:focus { outline: none; background: var(--card); }

  .progress-row { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
  .bar { flex: 1; height: 8px; border-radius: 4px; background: var(--card-2); overflow: hidden; }
  .bar > div { height: 100%; background: linear-gradient(90deg, #217346, #33c481); box-shadow: 0 0 10px var(--glow); transition: width .25s; }
  .count { font-size: 14px; color: var(--txt-2); font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .clear { font-size: 12px; color: var(--txt-3); background: none; border: none; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; flex-shrink: 0; }
  .clear:active { color: var(--txt); }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: 4px; padding: 16px; margin-bottom: 12px; }
  .card-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .ex-name { flex: 1; min-width: 0; background: transparent; border: none; color: var(--txt); font-size: 16px; font-weight: 600; padding: 2px 4px; border-radius: 4px; }
  .ex-name:focus { outline: none; background: var(--card-2); }
  .ex-count { font-size: 12px; color: var(--txt-3); font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .trash { background: none; border: none; color: var(--txt-3); cursor: pointer; flex-shrink: 0; padding: 2px; }
  .trash svg { width: 17px; height: 17px; }
  .trash:active { color: var(--red); }

  .set { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .idx { width: 24px; height: 24px; border-radius: 4px; background: var(--card-2); color: var(--txt-2); font-size: 12px; font-family: monospace;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .field { display: flex; align-items: center; gap: 4px; }
  .field input { background: var(--card-2); border: 1px solid var(--border); border-radius: 4px; padding: 7px 8px; text-align: right;
    font-variant-numeric: tabular-nums; color: var(--txt); font-size: 14px; }
  .field input:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(164,168,165,.12); }
  .kg { width: 62px; } .reps { width: 52px; }
  .unit { font-size: 12px; color: var(--txt-3); }
  .done { width: 36px; height: 36px; border-radius: 4px; border: 1px solid #3a3a38; background: transparent; color: var(--txt-3);
    display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; transition: .15s; }
  .done svg { width: 18px; height: 18px; }
  .done.on { background: var(--green); border-color: var(--green); color: #062e1a; box-shadow: 0 0 12px var(--glow); }
  .rm { margin-left: auto; background: none; border: none; color: var(--txt-3); cursor: pointer; font-size: 16px; flex-shrink: 0; padding: 4px; }
  .rm:active { color: var(--red); }

  .add-set { margin-top: 12px; width: 100%; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px;
    color: var(--blue-2); background: transparent; cursor: pointer; border: 1px dashed #3a3a38; border-radius: 4px; padding: 9px; }
  .add-set:active { border-color: var(--blue); }
  .add-ex { margin-top: 16px; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px;
    font-weight: 600; color: var(--txt); background: var(--card); border: 1px solid var(--border); border-radius: 4px; padding: 14px; cursor: pointer; }
  .add-ex:active { border-color: #3a3a38; }
  .foot { text-align: center; font-size: 12px; color: var(--txt-3); margin-top: 24px; }

  /* Hábitos */
  .hb-head { margin: 6px 0 20px; }
  .hb-title { font-size: 25px; font-weight: 700; letter-spacing: -0.01em; color: var(--txt); }
  .title-accent { width: 44px; height: 3px; border-radius: 2px; background: linear-gradient(90deg, #217346, #33c481); box-shadow: 0 0 10px var(--glow); margin: 9px 0 2px; }
  .hb-list { display: flex; flex-direction: column; gap: 10px; }
  .hb-item { display: flex; align-items: center; gap: 14px; background: var(--card); border: 1px solid var(--border); border-radius: 4px; padding: 14px 16px; cursor: pointer; transition: .15s; }
  .hb-item:active { background: var(--card-2); }
  .hb-check { width: 26px; height: 26px; border-radius: 4px; border: 1.5px solid var(--border); flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #fff; transition: .15s; }
  .hb-check.on { background: var(--green); border-color: var(--green); box-shadow: 0 0 12px var(--glow); }
  .hb-check svg { width: 16px; height: 16px; }
  .hb-name { flex: 1; font-size: 15px; font-weight: 500; }
  .hb-name.done { color: var(--txt-2); text-decoration: line-through; text-decoration-color: var(--txt-3); }
  .hb-rm { background: none; border: none; color: var(--txt-3); font-size: 15px; cursor: pointer; flex-shrink: 0; padding: 4px; }
  .hb-rm:active { color: var(--red); }
  .hb-add { display: flex; gap: 8px; margin-top: 16px; }
  .hb-add input { flex: 1; background: var(--card-2); border: 1px solid var(--border); border-radius: 4px; padding: 13px 14px; color: var(--txt); font-size: 15px; }
  .hb-add input:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(164,168,165,.12); }
  .hb-add-btn { width: 48px; border: none; border-radius: 4px; background: var(--blue); color: #fff; font-size: 24px; cursor: pointer; box-shadow: 0 0 16px var(--glow); }
  .hb-add-btn:active { filter: brightness(1.12); }
  .empty { color: var(--txt-3); text-align: center; padding: 28px 16px; font-size: 14px; line-height: 1.6; }

  /* Cardio */
  .cardio-modes { display: flex; gap: 8px; margin: 8px 0 8px; }
  .cmode { flex: 1; padding: 11px; border-radius: 4px; background: var(--card); border: 1px solid var(--border); color: var(--txt-2); font-size: 14px; font-weight: 600; cursor: pointer; text-align: center; }
  .cmode.active { background: var(--blue); color: #fff; border-color: var(--blue); box-shadow: 0 0 14px var(--glow); }
  .time-display { font-family: "JetBrains Mono", monospace; font-size: 64px; font-weight: 700; text-align: center; letter-spacing: -.02em; margin: 26px 0; color: var(--txt);  font-variant-numeric: tabular-nums; }
  .time-display.finished { color: var(--blue-2); animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.35;} }
  .ctrl-row { display: flex; gap: 10px; justify-content: center; margin-top: 6px; }
  .ctrl { flex: 1; max-width: 160px; padding: 15px; border-radius: 4px; border: none; font-size: 15px; font-weight: 600; cursor: pointer; }
  .ctrl.primary { background: var(--blue); color: #fff; box-shadow: 0 0 18px var(--glow); }
  .ctrl.ghost { background: var(--card); color: var(--txt); border: 1px solid var(--border); }
  .ctrl:active { filter: brightness(1.1); }
  .presets { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 18px; }
  .preset { padding: 9px 14px; border-radius: 4px; background: var(--card); border: 1px solid var(--border); color: var(--txt-2); font-size: 13px; cursor: pointer; font-variant-numeric: tabular-nums; }
  .preset.on { border-color: var(--blue); color: var(--blue-2); }
  .custom-time { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 6px; }
  .ct-input { width: 74px; background: var(--card-2); border: 1px solid var(--border); border-radius: 4px; padding: 13px; text-align: center; color: var(--txt); font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .ct-input:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(164,168,165,.12); }
  .ct-colon { font-size: 24px; font-weight: 700; color: var(--txt-2); }
  .ct-hint { text-align: center; font-size: 12px; color: var(--txt-3); margin-bottom: 22px; }
  .laps { margin-top: 26px; display: flex; flex-direction: column; gap: 6px; }
  .lap { display: flex; justify-content: space-between; padding: 11px 14px; background: var(--card); border: 1px solid var(--border); border-radius: 4px; font-variant-numeric: tabular-nums; font-size: 14px; }
  .lap span:first-child { color: var(--txt-2); }

  /* Comida / Calorías */
  .ring-wrap { position: relative; width: 180px; height: 180px; margin: 8px auto 6px; }
  .ring { width: 180px; height: 180px; transform: rotate(-90deg); }
  .ring-track { fill: none; stroke: var(--card-2); stroke-width: 10; }
  .ring-fill { fill: none; stroke: var(--blue); stroke-width: 10; stroke-linecap: round; filter: drop-shadow(0 0 6px var(--glow)); transition: stroke-dashoffset .4s; }
  .ring-fill.over { stroke: var(--red); filter: none; }
  .ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .ring-num { font-family: "JetBrains Mono", monospace; font-weight:700; font-size: 33px; font-weight: 800; color: var(--txt); font-variant-numeric: tabular-nums; }
  .ring-num.over { color: var(--red); }
  .ring-lbl { font-size: 12px; color: var(--txt-2); margin-top: 3px; }
  .ring-sub { text-align: center; color: var(--txt-2); font-size: 14px; margin-bottom: 18px; font-variant-numeric: tabular-nums; }
  .macros { display: flex; flex-direction: column; gap: 13px; margin-bottom: 12px; }
  .macro-top { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 5px; }
  .macro-top b { color: var(--txt); font-weight: 600; }
  .macro-top span { color: var(--txt-2); font-variant-numeric: tabular-nums; }
  .cal-edit { display: block; margin: 0 auto 22px; background: none; border: none; color: var(--blue-2); font-size: 13px; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
  .cal-search input { width: 100%; background: var(--card-2); border: 1px solid var(--border); border-radius: 4px; padding: 13px 14px; color: var(--txt); font-size: 15px; }
  .cal-search input:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(164,168,165,.12); }
  #foodResults { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .food-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--card); border: 1px solid var(--border); border-radius: 4px; padding: 11px 14px; cursor: pointer; }
  .food-row:active { background: var(--card-2); }
  .food-name { font-size: 14px; }
  .food-kcal { font-size: 13px; color: var(--blue-2); font-variant-numeric: tabular-nums; display: flex; flex-direction: column; align-items: flex-end; flex-shrink: 0; }
  .food-kcal span { font-size: 10px; color: var(--txt-3); }
  .cal-hint { color: var(--txt-3); font-size: 13px; text-align: center; padding: 14px; }
  .cal-create { margin: 10px 0 20px; width: 100%; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px;
    color: var(--blue-2); background: transparent; cursor: pointer; border: 1px dashed #3a3a38; border-radius: 4px; padding: 11px; }
  .cal-create:active { border-color: var(--blue); }
  .diary-head { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 12px; }
  .diary-head .t { font-size: 17px; font-weight: 700; }
  .diary-head .s { font-size: 13px; color: var(--txt-2); font-variant-numeric: tabular-nums; }
  .diary-item { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--border); border-radius: 4px; padding: 12px 14px; margin-bottom: 8px; cursor: pointer; transition: .15s; }
  .diary-item:active { background: var(--card-2); }
  .diary-name { flex: 1; min-width: 0; font-size: 14px; }
  .diary-name span { display: block; font-size: 12px; color: var(--txt-3); margin-top: 2px; }
  .diary-kcal { font-size: 14px; color: var(--txt); font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .diary-rm { background: none; border: none; color: var(--txt-3); font-size: 15px; cursor: pointer; flex-shrink: 0; padding: 4px; }
  .diary-rm:active { color: var(--red); }
  .cal-empty { text-align: center; padding: 40px 20px; }
  .cal-empty-ic { width: 60px; height: 60px; border-radius: 4px; background: var(--card-2); display: flex; align-items: center; justify-content: center; margin: 0 auto 18px; color: var(--blue-2); }
  .cal-empty-ic svg { width: 30px; height: 30px; }
  .cal-empty-title { font-size: 21px; font-weight: 700; margin-bottom: 8px; }
  .cal-empty-sub { color: var(--txt-2); font-size: 14px; line-height: 1.6; margin-bottom: 22px; }

  .sheet-bg { position: fixed; inset: 0; z-index: 59; background: rgba(0,0,0,.55); }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 60; max-width: 540px; margin: 0 auto;
    background: var(--card); border: 1px solid var(--border); border-bottom: none; border-radius: 4px 4px 0 0;
    padding: 22px 18px calc(20px + env(safe-area-inset-bottom)); box-shadow: 0 -12px 40px rgba(0,0,0,.6); }
  .sheet-title { font-size: 19px; font-weight: 700; margin-bottom: 16px; }
  .sheet-row { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
  .sheet-input { width: 110px; background: var(--card-2); border: 1px solid var(--border); border-radius: 4px; padding: 13px; text-align: center; color: var(--txt); font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .sheet-input:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(164,168,165,.12); }
  .sheet-unit { font-size: 15px; color: var(--txt-2); }
  .sheet-preview { color: var(--blue-2); font-size: 14px; font-variant-numeric: tabular-nums; margin-bottom: 18px; }
  .sheet-btns { display: flex; gap: 10px; }
  .sheet-btns .ctrl { max-width: none; }

  .form-head { display: flex; align-items: center; gap: 10px; margin: 6px 0 4px; }
  .form-back { background: none; border: none; color: var(--txt); font-size: 28px; cursor: pointer; line-height: 1; padding: 0 4px; }
  .form-title { font-size: 22px; font-weight: 700; }
  .form-sub { color: var(--txt-2); font-size: 13px; margin-bottom: 20px; }
  .form-group { margin-bottom: 18px; }
  .form-label { font-size: 13px; color: var(--txt-2); margin-bottom: 9px; display: block; }
  .seg { display: flex; flex-wrap: wrap; gap: 8px; }
  .seg button { padding: 11px 15px; border-radius: 4px; background: var(--card); border: 1px solid var(--border); color: var(--txt-2); font-size: 13px; font-weight: 600; cursor: pointer; }
  .seg button.on { background: var(--blue); color: #fff; border-color: var(--blue); box-shadow: 0 0 12px var(--glow); }
  .form-input { width: 100%; background: var(--card-2); border: 1px solid var(--border); border-radius: 4px; padding: 13px 14px; color: var(--txt); font-size: 16px; }
  .form-input:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(164,168,165,.12); }
  .form-row2 { display: flex; gap: 10px; }
  .form-row2 .form-group { flex: 1; }
  .form-save { margin-top: 6px; width: 100%; padding: 15px; border-radius: 4px; border: none; background: var(--blue); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; box-shadow: 0 0 18px var(--glow); }
  .form-save:active { filter: brightness(1.1); }
  .form-or { text-align: center; color: var(--txt-3); font-size: 12px; margin: 22px 0 12px; }

  .step-quick { display: flex; gap: 8px; margin-bottom: 12px; }
  .qbtn { flex: 1; padding: 13px; border-radius: 4px; background: var(--card); border: 1px solid var(--border); color: var(--txt); font-size: 14px; font-weight: 600; cursor: pointer; }
  .qbtn:active { border-color: var(--blue); }
  .step-set { display: flex; gap: 8px; margin-bottom: 14px; }
  .step-set .form-input { flex: 1; }

  .icon-mini { background: none; border: none; color: var(--txt-3); cursor: pointer; flex-shrink: 0; padding: 2px; }
  .icon-mini svg { width: 17px; height: 17px; }
  .icon-mini:active { color: var(--blue-2); }
  .ex-sheet { max-height: 82vh; display: flex; flex-direction: column; }
  .ex-search { width: 100%; background: var(--card-2); border: 1px solid var(--border); border-radius: 4px; padding: 12px 14px; color: var(--txt); font-size: 15px; margin-bottom: 12px; flex-shrink: 0; }

function initAudio(){ try{ audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==="suspended") audioCtx.resume(); }catch(e){} }
function beep(){
  try{ initAudio(); if(!audioCtx) throw 0; const now=audioCtx.currentTime;
    for(let i=0;i<3;i++){ const o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.connect(g); g.connect(audioCtx.destination);
      o.type="sine"; o.frequency.value=880; const t=now+i*0.28;
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.35,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.18);
      o.start(t); o.stop(t+0.2); } }catch(e){}
  try{ if(navigator.vibrate) navigator.vibrate([200,100,200,100,200]); }catch(e){}
}

let rest = {active:false,total:0,remaining:0,id:null};
function parseRest(txt){
  if(!txt) return 0;
  const t=String(txt).trim();
  let m=t.match(/(\d+):(\d+)/);
  if(m) return (+m[1])*60 + (+m[2]);
  m=t.match(/(\d+)\s*['\u2032]/);
  if(m) return (+m[1])*60;
  m=t.match(/(\d+)/);
  if(m){ const n=+m[1]; return n<=10 ? n*60 : n; }
  return 0;
}
function restFmt(s){ const m=Math.floor(s/60), x=s%60; return m+":"+String(x).padStart(2,"0"); }
function startRest(sec){ sec = sec || state.restDefault || 120; state.restDefault = sec; initAudio(); rest.active=true; rest.total=sec; rest.remaining=sec; if(rest.id) clearInterval(rest.id); rest.id=setInterval(restTick,1000); renderRestBar(); save(); }
function restTick(){ if(!rest.active) return; rest.remaining--; if(rest.remaining<=0) restFinish(); else updateRestBar(); }
function restFinish(){ rest.active=false; if(rest.id){ clearInterval(rest.id); rest.id=null; } try{ beep(); }catch(e){} renderRestBar(true); setTimeout(()=>{ if(!rest.active) renderRestBar(); }, 6000); }
function stopRest(){ rest.active=false; if(rest.id){ clearInterval(rest.id); rest.id=null; } renderRestBar(); }
function updateRestBar(){ const t=document.getElementById("restTime"); if(t) t.textContent=restFmt(rest.remaining); const b=document.getElementById("restProg"); if(b&&rest.total) b.style.width=Math.round((1-rest.remaining/rest.total)*100)+"%"; }
function renderRestBar(finished){
  const el=document.getElementById("restBar"); if(!el) return;
  if(finished){ el.style.display="block"; el.innerHTML='<div class="rest-inner rest-done"><span class="rest-msg">¡Descanso terminado! 💪</span><button class="rest-x" data-action="rest-stop">Cerrar</button></div>'; return; }
  if(rest.active){
    el.style.display="block";
    el.innerHTML='<div class="rest-inner"><span class="rest-lbl2">Descanso</span><span id="restTime" class="rest-time">'+restFmt(rest.remaining)+'</span><button class="rest-x" data-action="rest-stop" title="Saltar">✕</button><div class="rest-prog-track"><div id="restProg" class="rest-prog" style="width:'+Math.round((1-rest.remaining/rest.total)*100)+'%"></div></div></div>';
    return;
  }
  el.style.display="none"; el.innerHTML="";
}
function fmt(ms, ceil){ let s = ceil?Math.ceil(ms/1000):Math.floor(ms/1000); if(s<0)s=0;
  const h=Math.floor(s/3600), m=Math.floor((s%3600)/60), sec=s%60;
  const mm=String(m).padStart(2,"0"), ss=String(sec).padStart(2,"0"); return h>0 ? h+":"+mm+":"+ss : mm+":"+ss; }

function blockWeek(b, dstr){
  if(!b || !b.start_date) return 0;
  const a=new Date(b.start_date+"T00:00:00"), c=new Date((dstr||today())+"T00:00:00");
  const w=Math.floor((c-a)/(7*24*3600*1000))+1;
  return (w<1) ? 0 : w;
}
function isDeload(b, wk){ return !!(b && Array.isArray(b.deloads) && b.deloads.indexOf(wk)>=0); }
function hkey(name){ return today()+"|"+name; }
function mondayOf(dstr){ const d=new Date((dstr||today())+"T00:00:00"); const wd=(d.getDay()+6)%7; d.setDate(d.getDate()-wd); return d.toISOString().slice(0,10); }

const RC = 2*Math.PI*52;
let liveCounting=false, lpf=9.8, prevDyn=0, lastStepTs=0, stepsSaveTs=0;

function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e) {} try { cloudSyncCore(); } catch(e){} }
const day = () => state.days.find(d => d.id === activeId) || state.days[0];
function checkDaily(){ const t=today(); let ch=false;
  if (state.habitsDate !== t) { state.habits.forEach(h=>h.done=false); state.habitsDate=t; ch=true; }
  if (state.diaryDate !== t) { state.diary=[]; state.diaryDate=t; ch=true; }
  if (state.stepsDate !== t) { state.steps=0; state.stepsDate=t; ch=true; }
  if (state.waterDate !== t) { state.water=0; state.waterDate=t; ch=true; }
  if (ch) save();
}
function calcTarget(p){
  let bmr = 10*(+p.weight) + 6.25*(+p.height) - 5*(+p.age) + (p.sex==="m"?5:-161);
  const act = {sed:1.2,lig:1.375,mod:1.55,act:1.725,muy:1.9}[p.activity] || 1.55;
  const g = {bajar:0.8,mantener:1.0,ganar:1.1}[p.goal] || 1.0;
  return Math.round(bmr*act*g);
}
function macroTargets(){
  if(state.coachPlan){ const p=state.coachPlan; return {p:+p.protein||0, c:+p.carbs||0, f:+p.fat||0}; }
  const t = state.calTarget||0;
  const w = state.calProfile && state.calProfile.weight ? +state.calProfile.weight : 0;
  let p = w>0 ? Math.round(w*2) : Math.round(t*0.30/4);
  const f = Math.round(t*0.25/9);
  const c = Math.max(0, Math.round((t - p*4 - f*9)/4));
  return {p,c,f};
}
function diaryTotals(){ return state.diary.reduce((a,e)=>({kcal:a.kcal+e.kcal,p:a.p+e.p,c:a.c+e.c,f:a.f+e.f}),{kcal:0,p:0,c:0,f:0}); }
function onMotion(e){
  const a = e.accelerationIncludingGravity; if(!a) return;
  const mag = Math.sqrt((a.x||0)*(a.x||0)+(a.y||0)*(a.y||0)+(a.z||0)*(a.z||0));
  lpf = lpf*0.9 + mag*0.1;
  const dyn = mag - lpf, now = Date.now();
  if (dyn>1.2 && prevDyn<=1.2 && (now-lastStepTs)>300){
    state.steps = (state.steps||0)+1; lastStepTs=now;
    const el=document.getElementById("stepNum"); if(el) el.textContent=(state.steps).toLocaleString("es-AR");
    const ring=document.getElementById("stepRing"); if(ring){ const g=state.stepsGoal||10000; ring.style.strokeDashoffset = RC*(1-Math.min(state.steps/g,1)); }
    if(now-stepsSaveTs>3000){ save(); stepsSaveTs=now; }
  }
  prevDyn = dyn;
}
async function startLive(){

}

function fmtDate(d){ const p=(d||"").split("-"); if(p.length!==3) return d; const m=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"]; return parseInt(p[2],10)+" "+(m[parseInt(p[1],10)-1]||""); }
function fmtDInput(d){ const p=(d||"").split("-"); if(p.length!==3) return d; return p[2]+"/"+p[1]+"/"+p[0]; }
function renderWChart(ws, evenX, sz){
  const S = sz==="mini" ? {W:320,H:130,pl:36,pr:10,pt:12,pb:22,FS:9,DR:3.5,DR2:2.5,SW:2}
          : sz==="med"  ? {W:560,H:210,pl:46,pr:14,pt:16,pb:26,FS:11,DR:5,DR2:3.5,SW:2.5}
          : {W:340,H:180,pl:40,pr:14,pt:16,pb:24,FS:9,DR:4,DR2:3,SW:2.5};
  const W=S.W,H=S.H,pl=S.pl,pr=S.pr,pt=S.pt,pb=S.pb, plotW=W-pl-pr, plotH=H-pt-pb;
  const FS=S.FS, DR=S.DR, DR2=S.DR2, SW=S.SW;
  const times=ws.map(e=>new Date(e.date+"T00:00:00").getTime());
  const kgs=ws.map(e=>e.kg);
  let minK=Math.min.apply(null,kgs), maxK=Math.max.apply(null,kgs);
  if(maxK-minK < 0.0001){ minK-=0.5; maxK+=0.5; }
  const NICE=[0.2,0.25,0.5,1,1.25,1.5,2,2.5,5,10,20,25,50,100,200,250,500];
  let stepK=NICE[NICE.length-1];
  const TGT = (sz==="mini") ? 2.5 : 4;
  for(let i=0;i<NICE.length;i++){ if((maxK-minK)/NICE[i] <= TGT){ stepK=NICE[i]; break; } }
  let loK=Math.floor(minK/stepK)*stepK; if(minK-loK < stepK*0.2) loK-=stepK;
  let hiK=Math.ceil(maxK/stepK)*stepK; if(hiK-maxK < stepK*0.2) hiK+=stepK;
  const decK=(String(stepK).split(".")[1]||"").length;
  const nTicks=Math.round((hiK-loK)/stepK);
  const minT=Math.min.apply(null,times), maxT=Math.max.apply(null,times), tRange=maxT-minT;
  const useEven = evenX || !tRange;
  const X=(t,i)=> ws.length<2 ? pl+plotW/2 : (useEven ? pl+(i/(ws.length-1))*plotW : pl+((t-minT)/tRange)*plotW);
  const Y=k=> pt+(1-(k-loK)/(hiK-loK))*plotH;
  const pts=ws.map((e,i)=>({x:X(times[i],i),y:Y(e.kg)}));
  const line=pts.map((p,i)=>(i?"L":"M")+p.x.toFixed(1)+" "+p.y.toFixed(1)).join(" ");
  const baseY=(pt+plotH).toFixed(1);
  const area=pts.length>1 ? "M"+pts[0].x.toFixed(1)+" "+baseY+" "+pts.map(p=>"L"+p.x.toFixed(1)+" "+p.y.toFixed(1)).join(" ")+" L"+pts[pts.length-1].x.toFixed(1)+" "+baseY+" Z" : "";
  const yVals=[]; for(let i=0;i<=nTicks;i++) yVals.push(loK+i*stepK);
  const grid=yVals.map(v=>{const y=Y(v).toFixed(1);return '<line x1="'+pl+'" y1="'+y+'" x2="'+(W-pr)+'" y2="'+y+'" stroke="#4e4f4b" stroke-width="1"/><text x="'+(pl-8)+'" y="'+(parseFloat(y)+FS/3).toFixed(1)+'" fill="#747877" font-size="'+FS+'" text-anchor="end">'+v.toFixed(decK)+'</text>';}).join("");
  const dots=pts.map((p,i)=>'<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="'+(i===pts.length-1?DR:DR2)+'" fill="'+(i===pts.length-1?'#d2d6d8':'#747877')+'"/>').join("");
  const xl='<text x="'+pl+'" y="'+(H-6)+'" fill="#747877" font-size="'+FS+'" text-anchor="start">'+fmtDate(ws[0].date)+'</text>'+(ws.length>1?'<text x="'+(W-pr)+'" y="'+(H-6)+'" fill="#747877" font-size="'+FS+'" text-anchor="end">'+fmtDate(ws[ws.length-1].date)+'</text>':'');
  return '<div class="w-chart"><svg viewBox="0 0 '+W+' '+H+'" width="100%"><defs><linearGradient id="wg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#747877"/><stop offset="1" stop-color="#747877" stop-opacity="0"/></linearGradient></defs>'+grid+(area?'<path d="'+area+'" fill="url(#wg)" opacity="0.3"/>':'')+(pts.length>1?'<path d="'+line+'" fill="none" stroke="#d2d6d8" stroke-width="'+SW+'" stroke-linecap="round" stroke-linejoin="round"/>':'')+dots+xl+'</svg></div>';
}

function migrateNames(days){

    if(ES_DAYS[d.name]){ d.name=ES_DAYS[d.name]; changed=true; }
    (d.exercises||[]).forEach(ex=>{

  });

function loadSeriesFor(name){

  });
  return out;

  list.sort((a,b)=>(b.ts||0)-(a.ts||0));

function tick(){
  const now = Date.now();
  if (tmRunning){
    const rem = tmEndTs - now;
    if (rem <= 0){ tmRunning=false; tmRemainingMs=0; tmFinished=true; beep(); if(view==="cardio") renderApp(); }
    else { tmRemainingMs = rem; if(view==="cardio" && cardioMode==="timer"){ const el=document.getElementById("tmTime"); if(el) el.textContent=fmt(rem,true); } }
  }
  if (swRunning && view==="cardio" && cardioMode==="stopwatch"){ const el=document.getElementById("swTime"); if(el) el.textContent=fmt(swAccum+(now-swStartTs)); }
}
setInterval(tick, 100);

    const mEl=document.getElementById("tmMin"), sEl=document.getElementById("tmSec");
    const mm=parseInt(mEl&&mEl.value)||0, ss=parseInt(sEl&&sEl.value)||0;
    tmTarget = Math.min(3600000, Math.max(1000, (mm*60+ss)*1000)); tmRemainingMs = tmTarget;

  }
  if (a === "food-search") { foodQuery = t.value; const r=document.getElementById("foodResults"); if(r) r.innerHTML = renderResults(foodQuery); return; }
  if (a === "ex-search") { exQuery = t.value; const l=document.getElementById("exList"); if(l) l.innerHTML = renderExList(); return; }

  if (a === "cf-field") { foodForm[t.dataset.field] = t.value; return; }
  if (a === "cal-field") { calForm[t.dataset.field] = t.value; return; }
  if (a === "wkg-field") { weightForm.kg = t.value; return; }
  const d = day();

document.body.addEventListener("click", async e => {
  const navBtn = e.target.closest("[data-view]");
  if (navBtn) { view = navBtn.dataset.view; selectedFood=null; editEntry=null; calEditing=false; creatingFood=false; exPicker=null; renderApp(); return; }
  const el = e.target.closest("[data-action]"); if(!el) return;
  const a = el.dataset.action;
  if (routineLocked() && ["addday","delday","removeex","addset","removeset","ex-add-open","ex-swap","ex-insert","ex-choose","ex-custom","load-default-routine"].indexOf(a)>=0) return;

  // Hábitos
  if (a === "habit-add") { addHabit(); return; }
  if (a === "chabit-toggle") { const k=hkey(el.dataset.name); state.habitsDone[k]=!state.habitsDone[k]; save(); renderApp(); return; }
  if (a === "habit-toggle") { const h=state.habits.find(x=>x.id===el.dataset.id); if(h) h.done=!h.done; save(); renderApp(); return; }
  if (a === "habit-remove") { state.habits = state.habits.filter(x=>x.id!==el.dataset.id); save(); renderApp(); return; }

  // Cardio
  if (a === "cardio-mode") { cardioMode = el.dataset.mode; renderApp(); return; }
  if (a === "sw-toggle") { if(swRunning){ swAccum+=Date.now()-swStartTs; swRunning=false; } else { swStartTs=Date.now(); swRunning=true; } renderApp(); return; }
  if (a === "sw-lap") { swLaps.push(swAccum+(Date.now()-swStartTs)); renderApp(); return; }
  if (a === "sw-reset") { swRunning=false; swAccum=0; swStartTs=0; swLaps=[]; renderApp(); return; }
  if (a === "tm-preset") { tmTarget=parseInt(el.dataset.sec)*1000; tmRemainingMs=tmTarget; tmFinished=false; renderApp(); return; }
  if (a === "tm-toggle") { if(tmRunning){ tmRemainingMs=Math.max(0,tmEndTs-Date.now()); tmRunning=false; } else { initAudio(); tmEndTs=Date.now()+tmRemainingMs; tmRunning=true; tmFinished=false; } renderApp(); return; }
  if (a === "tm-reset") { tmRunning=false; tmFinished=false; tmRemainingMs=tmTarget; renderApp(); return; }

  // Comida
  if (a === "cal-open") { calForm = state.calProfile ? Object.assign({sex:"m",age:"",height:"",weight:"",activity:"mod",goal:"mantener"}, state.calProfile) : {sex:"m",age:"",height:"",weight:"",activity:"mod",goal:"mantener"}; calEditing=true; renderApp(); return; }
  if (a === "cal-cancel") { calEditing=false; renderApp(); return; }
  if (a === "cal-sex") { calForm.sex = el.dataset.val; renderApp(); return; }
  if (a === "cal-activity") { calForm.activity = el.dataset.val; renderApp(); return; }
  if (a === "cal-goal") { calForm.goal = el.dataset.val; renderApp(); return; }
  if (a === "cal-calc") {
    if(!(+calForm.age>0) || !(+calForm.height>0) || !(+calForm.weight>0)){ alert("Completá edad, altura y peso."); return; }
    state.calProfile = Object.assign({}, calForm); state.calTarget = calcTarget(calForm); calEditing=false; save(); renderApp(); return;
  }
  if (a === "cal-manual") { const m=parseInt((document.getElementById("calManual")||{}).value); if(m>0){ state.calTarget=m; calEditing=false; save(); renderApp(); } else alert("Ingresá un número de calorías válido."); return; }
  if (a === "food-create-open") { foodForm={name:"",kcal:"",p:"",c:"",f:""}; creatingFood=true; renderApp(); return; }
  if (a === "food-create-cancel") { creatingFood=false; renderApp(); return; }
  if (a === "food-create-save") {
    if(!foodForm.name.trim() || !(+foodForm.kcal>=0) || foodForm.kcal===""){ alert("Poné al menos nombre y calorías."); return; }
    state.foods.push({ name:foodForm.name.trim(), kcal:+foodForm.kcal||0, p:+foodForm.p||0, c:+foodForm.c||0, f:+foodForm.f||0, portion:100 });
    creatingFood=false; foodQuery=foodForm.name.trim(); save(); renderApp(); return;
  }
  if (a === "food-pick") { selectedFood = lastResults[parseInt(el.dataset.idx)]; renderApp(); return; }
  if (a === "portion-cancel") { selectedFood=null; editEntry=null; renderApp(); return; }
  if (a === "portion-add") {
    const g = parseFloat((document.getElementById("portionGrams")||{}).value); if(!(g>0)){ return; }
    const f = selectedFood; if(!f){ return; } const fc = g/100;
    state.diary.push({ id:uid(), name:f.name, grams:Math.round(g), kcal:Math.round(f.kcal*fc), p:+(f.p*fc).toFixed(1), c:+(f.c*fc).toFixed(1), f:+(f.f*fc).toFixed(1), base:{kcal:f.kcal,p:f.p,c:f.c,f:f.f} });
    selectedFood=null; save(); renderApp(); return;
  }
  if (a === "portion-save") {
    const g = parseFloat((document.getElementById("portionGrams")||{}).value); if(!(g>0)){ return; }
    const e = editEntry; if(!e){ return; } const base=entryBase(e); const fc=g/100;
    e.grams=Math.round(g); e.kcal=Math.round(base.kcal*fc); e.p=+(base.p*fc).toFixed(1); e.c=+(base.c*fc).toFixed(1); e.f=+(base.f*fc).toFixed(1); e.base=base;
    editEntry=null; save(); renderApp(); return;
  }
  if (a === "diary-edit") { editEntry = state.diary.find(x=>x.id===el.dataset.id)||null; selectedFood=null; renderApp(); return; }
  if (a === "diary-remove") { state.diary = state.diary.filter(x=>x.id!==el.dataset.id); save(); renderApp(); return; }

  // Pasos
  if (a === "steps-add") { state.steps = Math.max(0,(state.steps||0)+parseInt(el.dataset.n)); save(); renderApp(); return; }
  if (a === "steps-set") { const n=parseInt((document.getElementById("stepInput")||{}).value); if(n>=0){ state.steps=n; save(); renderApp(); } else alert("Pon\u00e9 un n\u00famero v\u00e1lido."); return; }
  if (a === "steps-goal") { const g=prompt("Meta diaria de pasos:", state.stepsGoal||10000); if(g!==null){ const n=parseInt(g); if(n>0){ state.stepsGoal=n; save(); renderApp(); } } return; }
  if (a === "steps-live") { if(liveCounting) stopLive(); else startLive(); return; }

  // Ejercicios (picker)
  if (a === "ex-add-open") { exPicker={mode:"add"}; exCat="pecho"; exQuery=""; renderApp(); return; }
  if (a === "ex-swap") { exPicker={mode:"swap", exId:el.dataset.ex}; exCat="pecho"; exQuery=""; renderApp(); return; }
  if (a === "ex-insert") { exPicker={mode:"insert", idx:(+el.dataset.i||0)}; exCat="pecho"; exQuery=""; renderApp(); return; }
  if (a === "ex-cat") { exCat=el.dataset.cat; exQuery=""; renderApp(); return; }
  if (a === "ex-cancel") { exPicker=null; renderApp(); return; }
  if (a === "ex-choose") { const name=el.dataset.name; const d=day(); const mm=(muscleOf(name)!=="otros")?muscleOf(name):exCat; if(exPicker && exPicker.mode==="swap"){ const ex=d.exercises.find(x=>x.id===exPicker.exId); if(ex){ ex.name=name; ex.mus=mm; } } else if(exPicker && exPicker.mode==="insert"){ d.exercises.splice(exPicker.idx,0,mkEx(name,2,mm)); } else { d.exercises.push(mkEx(name,2,mm)); } exPicker=null; save(); renderApp(); return; }
  if (a === "ex-custom") { const nm=prompt(exPicker&&exPicker.mode==="swap"?"Nuevo nombre del ejercicio:":"Nombre del ejercicio:",""); if(nm && nm.trim()){ const d=day(); const mm=exCat; if(exPicker&&exPicker.mode==="swap"){ const ex=d.exercises.find(x=>x.id===exPicker.exId); if(ex){ ex.name=nm.trim(); ex.mus=mm; } } else if(exPicker&&exPicker.mode==="insert"){ d.exercises.splice(exPicker.idx,0,mkEx(nm.trim(),2,mm)); } else { d.exercises.push(mkEx(nm.trim(),2,mm)); } exPicker=null; save(); renderApp(); } return; }

  // Peso corporal
  if (a === "daily-save") {
    const d = dailyForm || {};
    const kg = parseFloat(String(d.kg||"").replace(",","."));
    const rec = Object.assign({}, state.daily[today()]||{}, d);
    state.daily[today()] = rec;
    if(kg>0){ const exw=state.weights.find(w=>w.date===today()); if(exw) exw.kg=kg; else state.weights.push({id:uid(), date:today(), kg:kg}); }
    dailyForm=null; save(); try{ cloudSaveDaily(today(), rec); }catch(e){}
    alert("Registro guardado \u2713"); renderApp(); return;
  }
  if (a === "fb-set") { fbForm=fbForm||{}; fbForm[el.dataset.k]=el.dataset.v; renderFeedback(); return; }
  if (a === "fb-skip") { fbSession=null; fbForm=null; renderApp(); return; }
  if (a === "fb-save") {
    const se=state.sessions.find(x=>x.id===fbSession); const f=fbForm||{};
    if(se){ if(f.rpe) se.rpe=+f.rpe; if(f.pump) se.pump=+f.pump; if(f.joint) se.joint=(f.joint==="S\u00ed"); save(); try{ cloudSessionFeedback(se); }catch(e){} }
    fbSession=null; fbForm=null; renderApp(); return;
  }
  if (a === "ci-open") { checkinOpen=true; checkinForm=null; renderApp(); return; }
  if (a === "photo-del") { const path=el.dataset.path, id=el.dataset.id; try{ await cloudDeletePhoto(id, path); }catch(e){} return; }
  if (a === "ci-close") { checkinOpen=false; checkinForm=null; renderApp(); return; }
  if (a === "ci-adh") { checkinForm = checkinForm || JSON.parse(JSON.stringify(state.checkins[mondayOf(today())]||{})); checkinForm.adherence = parseInt(el.dataset.v); renderApp(); return; }
  if (a === "ci-save") {
    const wk = mondayOf(today());
    const f = checkinForm || {};
    state.checkins[wk] = Object.assign({}, state.checkins[wk]||{}, f);
    checkinOpen=false; checkinForm=null; save();
    try{ cloudSaveCheckin(wk, state.checkins[wk]); }catch(e){}
    alert("\u00a1Check-in enviado a tu coach! 💪"); renderApp(); return;
  }
  if (a === "daily-set") { dailyForm = dailyForm || Object.assign({}, state.daily[today()]||{}); dailyForm[el.dataset.k] = el.dataset.v; renderApp(); return; }
  if (a === "weight-save") { const dEl=document.getElementById("wDate"), kEl=document.getElementById("wKg"); const date=dEl?dEl.value:""; const kg=parseFloat((kEl?kEl.value:"").replace(",",".")); if(!date){ alert("Elegí una fecha."); return; } if(!(kg>0)){ alert("Poné un peso válido."); return; } const exw=state.weights.find(w=>w.date===date); if(exw) exw.kg=kg; else state.weights.push({id:uid(),date,kg}); weightForm={date:today(),kg:""}; save(); renderApp(); return; }
  if (a === "weight-edit") { const w=state.weights.find(x=>x.id===el.dataset.id); if(w){ weightForm={date:w.date,kg:String(w.kg)}; } renderApp(); return; }
  if (a === "weight-remove") { state.weights=state.weights.filter(x=>x.id!==el.dataset.id); save(); renderApp(); return; }

  // Agua
  if (a === "water-add") { const n=parseInt(el.dataset.n)||0; state.water=Math.max(0,(state.water||0)+n); save(); renderApp(); return; }
  if (a === "water-goal") { const v=prompt("Meta de agua en ml (ej: 3000):", String(Math.round(state.waterGoal||3000))); if(v!==null){ const n=parseInt(v); if(n>0){ state.waterGoal=n; save(); renderApp(); } } return; }
  if (a === "rest-set") { startRest(parseInt(el.dataset.sec)||120); return; }
  if (a === "rest-pick") { state.restDefault = parseInt(el.dataset.sec)||120; save(); renderRestBar(); return; }
  if (a === "rest-play") { startRest(state.restDefault||120); return; }
  if (a === "rest-from-ex") { const sc=parseInt(el.dataset.sec)||0; if(sc>0) startRest(sc); return; }
  if (a === "rest-stop") { stopRest(); return; }
  if (a === "save-session") { saveSession(); return; }
  if (a === "session-remove") { if(confirm("¿Borrar este entreno del historial?")){ const _s=state.sessions.find(x=>x.id===el.dataset.id); if(_s&&_s.cloudId){ try{ cloudDeleteSession(_s.cloudId); }catch(e){} } state.sessions=state.sessions.filter(x=>x.id!==el.dataset.id); save(); renderApp(); } return; }

  // Días
  if (a === "load-default-routine") { if(confirm("Esto reemplaza tus días de rutina actuales por la rutina por defecto (Upper/Lower). No toca tus pesos, sesiones ni hábitos. ¿Seguro?")){ state.days = JSON.parse(JSON.stringify(DEFAULT.days)); activeId = state.days[0].id; save(); renderApp(); } return; }
  if (a === "addday") { const nd={id:uid(),name:"Nuevo",subtitle:"",exercises:[]}; state.days.push(nd); activeId=nd.id; pendingFocusDay=true; save(); renderApp(); return; }
  if (a === "delday") { if(state.days.length<=1){ alert("Tiene que quedar al menos un día."); return; } if(confirm("¿Eliminar este día?")){ state.days=state.days.filter(x=>x.id!==activeId); activeId=state.days[0].id; save(); renderApp(); } return; }

  // Entreno
  if (a === "tab") { activeId = el.dataset.day; renderApp(); return; }
  const d = day();
  const ex = el.dataset.ex && d.exercises.find(x=>x.id===el.dataset.ex);
  if (a === "toggle") { const s=ex.sets.find(x=>x.id===el.dataset.set); s.done=!s.done; }
  else if (a === "addset") { ex.sets.push(mkSet()); }
  else if (a === "removeset") { ex.sets = ex.sets.filter(x=>x.id!==el.dataset.set); }
  else if (a === "removeex") { d.exercises = d.exercises.filter(x=>x.id!==el.dataset.ex); }
  else if (a === "clear") { d.exercises.forEach(x=>x.sets.forEach(s=>s.done=false)); }
  else return;
  save(); renderApp();
});


// ============ Supabase · Fase 1 (login + nube) ============
let sb=null, cloudUser=null, cloudProfile=null, cloudLoading=false, routineTimer=null, brandName="";
function applyBrand(){
  const t=document.getElementById("brandTag"), n=document.getElementById("brandName");
  if(!t||!n) return;
  if(brandName){ n.textContent=brandName; t.style.display="block"; document.title=brandName+" \u00b7 FitSheet"; }
  else { t.style.display="none"; document.title="FitSheet"; }
}
try { if (window.supabase) sb = window.supabase.createClient(SB_URL, SB_KEY); } catch(e){}

function showLogin(msg, mode, vals){
  mode = mode || "in"; vals = vals || {};
  const eq = v => String(v==null?"":v).replace(/"/g,"&quot;");
  const host=document.getElementById("authHost"); if(!host) return;
  host.style.display="flex";
  host.innerHTML =
    '<div class="auth-card">'+
      '<div class="auth-logo"><span class="b">Fit</span>Sheet</div>'+
      '<div class="auth-sub">Tu planilla de entrenamiento</div>'+
      (mode==="up"?'<input id="auName" class="auth-in" placeholder="Tu nombre y apellido" value="'+eq(vals.name)+'">':'')+
      '<input id="auEmail" class="auth-in" type="email" placeholder="Email (ej: nombre@gmail.com)" autocomplete="username" value="'+eq(vals.email)+'">'+
      '<input id="auPass" class="auth-in" type="password" placeholder="Contraseña (mínimo 6)" autocomplete="current-password">'+
      (mode==="up"?'<input id="auCode" class="auth-in" placeholder="Código de tu coach" value="'+eq(vals.code)+'">':'')+
      (msg?'<div class="auth-msg">'+msg+'</div>':'')+
      '<button class="auth-btn" data-auth="'+(mode==="up"?"do-signup":"do-login")+'">'+(mode==="up"?"Crear cuenta":"Ingresar")+'</button>'+
      '<div class="auth-switch" data-auth="'+(mode==="up"?"to-login":"to-signup")+'">'+(mode==="up"?"Ya tengo cuenta":"Crear una cuenta nueva")+'</div>'+
    '</div>';
}
function hideLogin(){ const h=document.getElementById("authHost"); if(h){ h.style.display="none"; h.innerHTML=""; } }

async function afterLogin(){
  try { const r=await sb.auth.getUser(); cloudUser=r.data.user; } catch(e){}
  await loadCloud();
  try{
    const pc=localStorage.getItem("jfit_pending_code");
    if(pc && cloudProfile && cloudProfile.role!=="coach" && !cloudProfile.coach_id){
      const r2=await sb.rpc("join_coach",{code:pc});
      if(r2.data===true){ localStorage.removeItem("jfit_pending_code"); const pr=await sb.from("profiles").select("*").eq("id",cloudUser.id).maybeSingle(); if(pr.data) cloudProfile=pr.data; await loadCloud(); }
    }
  }catch(e){ console.error("pending code",e); }
  hideLogin();
  try{
    if(cloudProfile && cloudProfile.role==="coach"){ brandName=cloudProfile.full_name||""; }
    else { const cn=await sb.rpc("my_coach_name"); brandName=cn.data||""; }
  }catch(e){ brandName=""; }
  applyBrand();
  if (cloudProfile && cloudProfile.role==="coach"){ await loadCoachClients(); renderCoach(); }
  else { renderApp(); }
}

async function loadCloud(){
  if(!sb||!cloudUser) return;
  cloudLoading=true;
  try{
    const pr=await sb.from("profiles").select("*").eq("id",cloudUser.id).maybeSingle();
    cloudProfile=pr.data||null;
    const rt=await sb.from("routines").select("days").eq("client_id",cloudUser.id).maybeSingle();
    if(rt.data && Array.isArray(rt.data.days) && rt.data.days.length){
      state.days=rt.data.days;
      migrateNames(state.days);
      if(!state.days.find(d=>d.id===activeId)) activeId=state.days[0].id;
    } else {
      await sb.from("routines").upsert({client_id:cloudUser.id, days:state.days, updated_at:new Date().toISOString(), updated_by:cloudUser.id},{onConflict:"client_id"});
    }
    const ws=await sb.from("body_weights").select("*").eq("client_id",cloudUser.id).order("measured_on");
    if(Array.isArray(ws.data)) state.weights=ws.data.map(w=>({id:w.id, date:w.measured_on, kg:Number(w.kg)}));
    const ss=await sb.from("sessions").select("id, performed_on, day_name, created_at, session_entries(exercise_name,set_order,kg,reps)").eq("client_id",cloudUser.id).order("created_at");
    if(Array.isArray(ss.data)){
      state.sessions=ss.data.map(se=>{
        const byEx={};
        (se.session_entries||[]).forEach(en=>{ (byEx[en.exercise_name]=byEx[en.exercise_name]||[]).push({kg:Number(en.kg)||0, reps:Number(en.reps)||0}); });
        const exercises=Object.keys(byEx).map(n=>({name:n, sets:byEx[n]}));
        return {id:se.id, cloudId:se.id, date:se.performed_on, ts:new Date(se.created_at).getTime(), day:se.day_name, exercises:exercises};
      });
    }
    const dl=await sb.from("daily_logs").select("*").eq("client_id",cloudUser.id);
    if(Array.isArray(dl.data)){ state.daily={}; dl.data.forEach(r=>{ state.daily[r.log_date]={steps:r.steps||"", comment:r.comment||"", soreness:r.soreness||"", performance:r.performance||"", motivation:r.motivation||"", hunger:r.hunger||"", fatigue:r.fatigue||"", sleep:r.sleep||""}; }); }
    const ck=await sb.from("checkins").select("*").eq("client_id",cloudUser.id);
    if(Array.isArray(ck.data)){ state.checkins={}; ck.data.forEach(r=>{ const o=Object.assign({}, r.answers||{}); if(r.adherence) o.adherence=r.adherence; state.checkins[r.week_start]=o; }); }
    const ci=await sb.from("client_info").select("*").eq("client_id",cloudUser.id).maybeSingle();
    state.info = ci.data || null;
    const bl=await sb.from("blocks").select("*").eq("client_id",cloudUser.id).eq("active",true).order("start_date",{ascending:false}).limit(1);
    state.block = (bl.data && bl.data[0]) ? bl.data[0] : null;
    const np=await sb.from("nutrition").select("*").eq("client_id",cloudUser.id).maybeSingle();
    state.coachPlan = np.data ? {kcal:np.data.kcal, protein:np.data.protein, carbs:np.data.carbs, fat:np.data.fat, notes:np.data.notes, plan:np.data.plan||null, cardio:(np.data.plan&&np.data.plan.cardio)||null, habits:(np.data.plan&&np.data.plan.habits)||null} : null;
    await loadMyPhotos();
    save();
  }catch(e){ console.error("loadCloud",e); }
  cloudLoading=false;
}

function cloudSyncCore(){
  if(!sb||!cloudUser||cloudLoading) return;
  clearTimeout(routineTimer);
  routineTimer=setTimeout(async ()=>{
    try{
      await sb.from("routines").upsert({client_id:cloudUser.id, days:state.days, updated_at:new Date().toISOString(), updated_by:cloudUser.id},{onConflict:"client_id"});
      const rows=(state.weights||[]).map(w=>({client_id:cloudUser.id, measured_on:w.date, kg:w.kg}));
      if(rows.length) await sb.from("body_weights").upsert(rows,{onConflict:"client_id,measured_on"});
      const cw=await sb.from("body_weights").select("measured_on").eq("client_id",cloudUser.id);
      const local=new Set((state.weights||[]).map(w=>w.date));
      const del=(cw.data||[]).map(w=>w.measured_on).filter(d=>!local.has(d));
      for(const dd of del){ await sb.from("body_weights").delete().eq("client_id",cloudUser.id).eq("measured_on",dd); }
    }catch(e){ console.error("sync",e); }
  },1200);
}

async function loadMyPhotos(){
  if(!sb||!cloudUser) return;
  try{
    const r=await sb.from("checkin_photos").select("*").eq("client_id",cloudUser.id).order("created_at",{ascending:false});
    myPhotos=[];
    for(const p of (r.data||[])){
      const u=await sb.storage.from("checkins").createSignedUrl(p.path, 3600);
      myPhotos.push({id:p.id, path:p.path, url:(u.data&&u.data.signedUrl)||""});
    }
  }catch(e){ console.error("photos",e); }
}
async function cloudUploadPhoto(file){
  if(!sb||!cloudUser) return;
  const ext=(file.name.split(".").pop()||"jpg").toLowerCase();
  const path=cloudUser.id+"/"+Date.now()+"."+ext;
  const up=await sb.storage.from("checkins").upload(path, file, {upsert:false});
  if(up.error) throw up.error;
  await sb.from("checkin_photos").insert({client_id:cloudUser.id, path:path, taken_on:today()});
  await loadMyPhotos(); renderApp();
}
async function cloudDeletePhoto(id, path){
  if(!sb||!cloudUser) return;
  try{ await sb.storage.from("checkins").remove([path]); await sb.from("checkin_photos").delete().eq("id",id); await loadMyPhotos(); renderApp(); }catch(e){ console.error(e); }
}
async function cloudSessionFeedback(se){
  if(!sb||!cloudUser||!se.cloudId) return;
  try{ await sb.from("sessions").update({rpe:se.rpe||null, pump:se.pump||null, joint_pain:(typeof se.joint==="boolean")?se.joint:null}).eq("id",se.cloudId); }
  catch(e){ console.error("fb",e); }
}
async function cloudSaveDaily(dt, rec){
  if(!sb||!cloudUser) return;
  try{
    await sb.from("daily_logs").upsert({
      client_id:cloudUser.id, log_date:dt,
      steps: parseInt(rec.steps)||null, comment: rec.comment||null,
      soreness: rec.soreness||null, performance: rec.performance||null, motivation: rec.motivation||null,
      hunger: rec.hunger||null, fatigue: rec.fatigue||null, sleep: rec.sleep||null
    },{onConflict:"client_id,log_date"});
  }catch(e){ console.error("daily",e); }
}
async function cloudSaveCheckin(wk, f){
  if(!sb||!cloudUser) return;
  try{
    const ans=Object.assign({},f); const adh=ans.adherence; delete ans.adherence;
    await sb.from("checkins").upsert({client_id:cloudUser.id, week_start:wk, answers:ans, adherence:adh||null},{onConflict:"client_id,week_start"});
  }catch(e){ console.error("checkin",e); }
}
async function cloudInsertSession(se){
  if(!sb||!cloudUser) return;
  try{
    const r=await sb.from("sessions").insert({client_id:cloudUser.id, performed_on:se.date, day_name:se.day}).select("id").single();
    if(r.error) throw r.error;
    se.cloudId=r.data.id;
    const entries=[];
    (se.exercises||[]).forEach(ex=>{ (ex.sets||[]).forEach((sset,i)=>{ entries.push({session_id:r.data.id, client_id:cloudUser.id, exercise_name:ex.name, set_order:i, kg:sset.kg, reps:sset.reps}); }); });
    if(entries.length) await sb.from("session_entries").insert(entries);
    save();
  }catch(e){ console.error("insertSession",e); }
}
async function cloudDeleteSession(cid){ if(!sb||!cloudUser||!cid) return; try{ await sb.from("sessions").delete().eq("id",cid); }catch(e){} }

document.body.addEventListener("click", async e=>{
  const b=e.target.closest("[data-auth]"); if(!b) return;
  const a=b.dataset.auth;
  if(a==="to-signup"){ showLogin("","up"); return; }
  if(a==="to-login"){ showLogin("","in"); return; }
  if(a==="logout"){ try{ await sb.auth.signOut(); }catch(e){} location.reload(); return; }
  if(a==="join"){ const code=((document.getElementById("joinCode")||{}).value||"").trim(); if(!code){ alert("Poné el código de tu coach."); return; } try{ const r=await sb.rpc("join_coach",{code:code}); if(r.data===true){ const pr=await sb.from("profiles").select("*").eq("id",cloudUser.id).maybeSingle(); if(pr.data) cloudProfile=pr.data; await loadCloud(); alert("¡Listo! Te vinculaste con tu coach."); renderApp(); } else { alert("Código inválido. Revisalo con tu coach."); } }catch(err){ alert("No se pudo vincular: "+((err&&err.message)||err)); } return; }
  if(a==="do-login"||a==="do-signup"){
    const mode = a==="do-signup"?"up":"in";
    const email=((document.getElementById("auEmail")||{}).value||"").trim();
    const pass=(document.getElementById("auPass")||{}).value||"";
    const name=((document.getElementById("auName")||{}).value||"").trim();
    const code=((document.getElementById("auCode")||{}).value||"").trim();
    const V={name:name, email:email, code:code};
    if(!email||!pass){ showLogin("Completá email y contraseña.", mode, V); return; }
    if(!/^[^@ ]+@[^@ ]+\.[^@ ]+$/.test(email)){ showLogin("Poné un email válido, con @ y punto (ej: nombre@gmail.com).", mode, V); return; }
    if(pass.length<6){ showLogin("La contraseña necesita al menos 6 caracteres.", mode, V); return; }
    if(mode==="up" && name.length<2){ showLogin("Poné tu nombre y apellido, así tu coach sabe quién sos.", mode, V); return; }

    return;

});

function coachExercises(sessions){ const m={}; (sessions||[]).forEach(se=>se.exercises.forEach(ex=>{ if(ex.name) m[ex.name]=1; })); return Object.keys(m).sort((a,b)=>a.localeCompare(b,"es")); }
function coachSeries(sessions,name){ const out=[]; (sessions||[]).slice().sort((a,b)=>(a.ts||0)-(b.ts||0)).forEach(se=>{ let mx=0; se.exercises.forEach(ex=>{ if(ex.name===name) ex.sets.forEach(x=>{ const k=+x.kg||0; if(k>mx) mx=k; }); }); if(mx>0) out.push({date:se.date, kg:mx}); }); return out; }
function coachLogFor(sessions, dayName, name){
  const out=[];
  (sessions||[]).slice().sort((a,b)=>(b.ts||0)-(a.ts||0)).forEach(se=>{
    if(dayName && se.day && se.day!==dayName) return;
    const sets=[];
    se.exercises.forEach(ex=>{ if(ex.name===name) ex.sets.forEach(st=>{ if((+st.kg||0)>0||(+st.reps||0)>0) sets.push({kg:+st.kg||0, reps:+st.reps||0}); }); });
    if(sets.length) out.push({date:se.date, ts:se.ts, sets:sets});
  });
  return out;
}
function coachExerciseLog(sessions,name){ const out=[]; (sessions||[]).slice().sort((a,b)=>(a.ts||0)-(b.ts||0)).forEach(se=>{ const sets=[]; se.exercises.forEach(ex=>{ if(ex.name===name) ex.sets.forEach(st=>{ if((+st.kg||0)>0||(+st.reps||0)>0) sets.push({kg:+st.kg||0, reps:+st.reps||0}); }); }); if(sets.length) out.push({date:se.date, ts:se.ts, sets:sets}); }); return out; }

function cpApply(name){

  const mm=(muscleOf(name)!=="otros")?muscleOf(name):(coachPCat||"otros");
  if(coachPicker.mode==="swap"){ const ex=day.exercises[coachPicker.i]; if(ex){ ex.name=name; ex.mus=mm; } }

  if(a==="pl-habitadd"){ const p=coachPlanObj(coachData); (p.habits=p.habits||[]).push(""); renderCoach(); return; }
  if(a==="pl-habitdel"){ const p=coachPlanObj(coachData); p.habits.splice(+b.dataset.i,1); renderCoach(); return; }
  if(a==="pl-swapdel"){ const p=coachPlanObj(coachData); p.swaps.splice(+b.dataset.i,1); renderCoach(); return; }
  if(a==="save-routine"){ b.textContent="Guardando..."; (async()=>{ try{ const r=await sb.from("routines").upsert({client_id:coachSel, days:coachData.routine, updated_at:new Date().toISOString(), updated_by:cloudUser.id},{onConflict:"client_id"}); if(r.error) throw r.error; alert("Rutina guardada. El cliente la va a ver al abrir la app."); }catch(err){ alert("No se pudo guardar: "+((err&&err.message)||err)); } renderCoach(); })(); return; }
});
document.body.addEventListener("change", async e => {
  const el=e.target.closest("[data-coach]"); if(!el||!coachData) return;
  const a=el.dataset.coach;
  if(a==="ex"){ coachData.loadEx=el.value; renderCoach(); }
  else if(a==="dayfilter"){ coachDayFilter=el.value||null; coachData.loadEx=null; renderCoach(); }
});
document.body.addEventListener("input", async e => {
  const el=e.target.closest("[data-coach]"); if(!el||!coachData||!coachData.routine) return;
  const a=el.dataset.coach; const day=coachData.routine[coachEditDay]; if(!day) return;
  if(a==="rt-name"){ if(day.exercises[+el.dataset.i]) day.exercises[+el.dataset.i].name=el.value; }
  else if(a==="day-name"){ day.name=el.value; }
  else if(a==="rt-target"){ const ex=day.exercises[+el.dataset.i]; const st=ex&&ex.sets[+el.dataset.j]; if(st){ const v=el.value.trim(); if(v) st.target=v; else delete st.target; } }
  else if(a==="rt-note"){ const ex=day.exercises[+el.dataset.i]; if(ex){ const v=el.value.trim(); if(v) ex.note=v; else delete ex.note; } }
  else if(a==="day-note"){ const v=el.value.trim(); if(v) day.note=v; else delete day.note; }
  else if(a==="rt-o"||a==="rt-rir"||a==="rt-rest"||a==="rt-goal"||a==="rt-video"){ const ex=day.exercises[+el.dataset.i]; if(ex){ const k=(a==="rt-video")?"video":a.slice(3); const v=el.value.trim(); if(v) ex[k]=v; else delete ex[k]; } }
  else if(a.indexOf("info-")===0){ coachInfoForm = coachInfoForm || Object.assign({}, coachData.info||{}); coachInfoForm[a.slice(5)] = el.value; return; }
  else if(a.indexOf("blk-")===0){ coachBlockForm = coachBlockForm || Object.assign({}, coachData.block||{}); coachBlockForm[a.slice(4)] = el.value; return; }
  else if(a==="plan-kcal"||a==="plan-protein"||a==="plan-carbs"||a==="plan-fat"||a==="plan-notes"){ coachPlanForm = coachPlanForm || Object.assign({}, coachData.plan||{}); coachPlanForm[a.slice(5)] = el.value; }
  else if(a==="pl-meal"){ const p=coachPlanObj(coachData); const r=p[el.dataset.key][+el.dataset.i]; if(r) r[el.dataset.k]=el.value; }
  else if(a==="pl-list"){ const p=coachPlanObj(coachData); p[el.dataset.key][+el.dataset.i]=el.value; }
  else if(a==="pl-water"){ coachPlanObj(coachData).water=el.value; }
  else if(a==="pl-salt"){ coachPlanObj(coachData).salt=el.value; }
  else if(a==="pl-optsec"){ const p=coachPlanObj(coachData); p.options[+el.dataset.i].title=el.value; }
  else if(a==="pl-optlabel"){ const p=coachPlanObj(coachData); p.options[+el.dataset.i].opts[+el.dataset.j].label=el.value; }
  else if(a==="pl-optbody"){ const p=coachPlanObj(coachData); p.options[+el.dataset.i].opts[+el.dataset.j].body=el.value; }
  else if(a==="pl-swap"){ const p=coachPlanObj(coachData); p.swaps[+el.dataset.i][el.dataset.k]=el.value; }
  else if(a==="pl-cardiotext"){ const p=coachPlanObj(coachData); p.cardio=p.cardio||{text:"",items:[]}; p.cardio.text=el.value; }
  else if(a==="pl-cardioitem"){ const p=coachPlanObj(coachData); p.cardio.items[+el.dataset.i]=el.value; }
  else if(a==="pl-habit"){ const p=coachPlanObj(coachData); p.habits[+el.dataset.i]=el.value; }
});

document.addEventListener("visibilitychange", async ()=>{
  if(document.visibilityState!=="visible" || !sb || !cloudUser || !routineLocked()) return;
  try{
    const rt=await sb.from("routines").select("days").eq("client_id",cloudUser.id).maybeSingle();
    if(rt.data && Array.isArray(rt.data.days) && rt.data.days.length){
      state.days=rt.data.days;
      if(!state.days.find(x=>x.id===activeId)) activeId=state.days[0].id;
      renderApp();
    }
  }catch(e){}
});

async function cloudBoot(){
  if(!sb){ renderApp(); return; }
  try{
    const sess=await sb.auth.getSession();
    if(sess.data.session){ await afterLogin(); }
    else { showLogin("","in"); }
  }catch(e){ renderApp(); }
}

if (migrateNames(state.days)) save();
cloudBoot();
if ("serviceWorker" in navigator) { window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(()=>{}); }); }
</script>
</body>
</html>
