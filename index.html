<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

  <meta name="apple-mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800&family=JetBrains+Mono:wght@500;600;700;800&family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    /* Paleta "estilo WHOOP" (prueba, ver App-gym.html) — fondo casi negro puro en vez del
       verde Excel claro por defecto. Cambiados: bg/card/card-2/border/txt (pedido explícito),
       más blue-2/green-2/glow porque son la sombra/shade derivada de blue/green y se usan
       junto a ellos en todos lados (hover, "over", glow de botones activos) — dejarlos en el
       verde Excel viejo se hubiera visto como dos marcas distintas conviviendo. red/purple/
       pink/cyan/txt-2/txt-3/xl-head/xl-band NO tocados: son roles semánticos aparte (peligro,
       categorías del plan de comidas), no la identidad de marca. Commit propio a propósito
       para poder revertir solo esto. */
    --bg: #060907; --card: #0e1512; --card-2: #141c17; --border: rgba(255,255,255,.09);
    --txt: #f3f7f4; --txt-2: #566159; --txt-3: #8a948b;
    --blue: #22e08a; --blue-2: #17b56d; --red: #c0392b;
    --green: #22e08a; --green-2: #17b56d; --purple: #2e78b8; --pink: #c9662b; --cyan: #178a80;
    --glow: rgba(34,224,138,.28);
    --ring-over: #d43f3f; --glow-over: rgba(212,63,63,.30);
    --xl-head: #217346; --xl-band: #185c37;
    --font-mono: "JetBrains Mono", monospace;
    --text-meta: 12px;      /* secundario: hints, timestamps, sub-labels, botones fantasma */
    --text-body: 14px;      /* primario: nombres, valores, inputs, botones estándar */
    --text-emphasis: 15px;  /* énfasis dentro de una fila: nombre destacado, CTA principal */
    --text-set-value: 18px; /* el dato central del entreno: kg/reps de la serie — no es un paso de la escala 12-15, es su propio rol */
    --transition-tap: color .15s, background-color .15s, border-color .15s;
    --ease-drawer: cubic-bezier(.32,.72,0,1);
    --duration-frequent: .15s; /* se ve/cierra muchas veces por sesión: modales del coach */
    --duration-standard: .22s; /* el caso por defecto: bottom sheet de logueo */
    --duration-rare: .3s;      /* poco frecuente o primera vez: pantalla de login */
    --focus-ring: 0 0 0 3px rgba(164,168,165,.12);
    --shadow-card: 0 1px 2px rgba(30,43,34,.06), 0 3px 8px rgba(30,43,34,.05);
    --glow-sm: 0 0 10px var(--glow);  /* acentos finos: barra de progreso, línea de título */
    --glow-md: 0 0 14px var(--glow);  /* estado seleccionado/activo: tab, chip, check, toggle */
    --glow-lg: 0 0 18px var(--glow);  /* CTA principal / marca: botón primario, ícono de marca */
    --icon-xs: 12px;  /* ícono inline dentro de texto chico/meta */
    --icon-sm: 14px;  /* ícono inline junto a texto secundario */
    --icon-md: 16px;  /* botón solo-ícono estándar */
    --icon-lg: 18px;  /* botón solo-ícono en la barra superior */
    --icon-xl: 20px;  /* ícono enfatizado — el control más tocado (.done) */
    --space-2: 2px;   /* hairline */
    --space-4: 4px;   /* ajustado */
    --space-6: 6px;   /* gap compacto: ícono+texto, tabs */
    --space-8: 8px;   /* el valor más común de toda la app */
    --space-10: 10px; /* segundo más común — padding/margin por defecto */
    --space-12: 12px; /* padding cómodo */
    --space-14: 14px; /* padding de card/sheet */
    --space-16: 16px; /* espaciado a nivel de sección */
    --space-24: 24px; /* espaciado grande, poco frecuente */
  }
  input::placeholder, textarea::placeholder { color: var(--txt-3); opacity:.7; }
  /* Elevación compartida por toda la familia de cards (ver bloques body.silk-on/
     body.silk-coach más abajo, que redefinen --shadow-card para modo oscuro). */
  .card, .hb-item, .food-row, .diary-item, .w-chart, .w-item, .water-card, .vol-card,
  .fi-card, .mc-block, .cardio-rx, .plan-banner, .join-box, .daynotes, .daily-card, .ci-card,
  .sess-item, .hx-row {
    box-shadow: var(--shadow-card);
  }
  /* Elevación + iluminación de borde al pasar el cursor, para toda la familia de cajas
     de arriba EXCEPTO .card y .daynotes: esas dos son exclusivas de Entreno y .card ya
     tiene su propio efecto de foco por scroll (.ex-focused, ver más abajo) — agregarle
     un hover encima lo pisaría. El resto (Hábitos/Cardio/Comida/Progreso/Ajustes) no
     tenía ningún feedback de hover, solo :active para tap; esto lo suma sin tocar nada
     de Entreno. Mismo :is()+nesting que el bloque "Meteors" más abajo, una sola lista. */
  :is(.hb-item, .food-row, .diary-item, .w-chart, .w-item, .water-card, .vol-card,
    .fi-card, .mc-block, .cardio-rx, .plan-banner, .join-box, .daily-card, .ci-card,
    .sess-item, .hx-row) {
    transition: transform var(--duration-standard) var(--ease-drawer),
                border-color var(--duration-standard) ease,
                box-shadow var(--duration-standard) ease;
    &:hover {
      transform: translateY(-2px);
      border-color: rgba(127,224,168,.5);
      box-shadow: var(--shadow-card), 0 0 16px var(--glow);
    }
    @media (prefers-reduced-motion: reduce) {
      &:hover { transform: none; }
    }
  }
  html, body { background: var(--bg); background-attachment: fixed; color: var(--txt); }
  body { font-family: "Public Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif; min-height: 100vh; overflow-x: hidden; }
  body::before { content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: radial-gradient(720px circle at 50% -6%, rgba(33,115,70,.06), transparent 55%); }

  /* ===== Fondo de partículas (Entreno / Hábitos / Cardio / Comida / Progreso) =====
     Mismo fondo que el login (FluidParticlesBackground): degradé oscuro de marca + partículas
     finas a la deriva. Un solo canvas 2D compartido por las 5 pestañas — se muestra/oculta
     según la vista activa, nunca se recrea. La legibilidad se resuelve aclarando puntualmente
     el texto "suelto" (el que no vive dentro de una card opaca), scopeado bajo body.silk-on
     para no afectar login/coach/otras vistas. */
  #silkCanvas {
    position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none;
    opacity: 0; transition: opacity .3s ease;
    background:
      radial-gradient(900px circle at 18% -8%, rgba(51,196,129,.16), transparent 55%),
      radial-gradient(700px circle at 100% 100%, rgba(46,120,184,.10), transparent 50%),
      linear-gradient(160deg, #101913 0%, #0b120e 55%, #070a08 100%);
  }
  #silkCanvas.on { opacity: 1; }

  /* --- Legibilidad sobre el fondo oscuro de partículas, sin overlay blanco ---
     Sólo texto/controles que quedan directamente sobre el fondo (sin card opaca detrás)
     dentro de Entreno/Hábitos/Cardio/Comida/Progreso. No toca coach panel ni sheet modal. */
  body.silk-on .day-name, body.silk-on .hb-title, body.silk-on .time-display,
  body.silk-on .ring-num, body.silk-on .w-now, body.silk-on .diary-head .t,
  body.silk-on .cal-empty-title, body.silk-on .macro-top b, body.silk-on .wordmark .w,
  body.silk-on .client-name { color: #eafff2; }
  body.silk-on .day-sub, body.silk-on .count, body.silk-on .empty, body.silk-on .ring-sub,
  body.silk-on .ring-lbl, body.silk-on .diary-head .s, body.silk-on .cal-empty-sub,
  body.silk-on .w-meta, body.silk-on .macro-top span, body.silk-on .foot,
  body.silk-on .reset-routine, body.silk-on .client-sub { color: #a9d9bd; }
  body.silk-on .clear, body.silk-on .cardio-tools-h, body.silk-on .ct-hint,
  body.silk-on .load-def { color: #7fbf9c; }
  body.silk-on .clear:active { color: #eafff2; }
  body.silk-on .time-display.finished { color: var(--blue-2); }
  body.silk-on .ring-num.over { color: var(--blue-2); }
  body.silk-on .day-name:focus, body.silk-on .day-sub:focus { color: var(--txt); }
  body.silk-on .reset-routine, body.silk-on .load-def, body.silk-on .clear { border-color: rgba(234,255,242,.28); }
  body.silk-on .add-set, body.silk-on .cal-create { color: #7fe0a8; border-color: rgba(127,224,168,.45); }
  body.silk-on .day-del { color: #7fbf9c; }

  /* --- Estilo "Meteors" para las cajas de contenido (Entreno/Hábitos/Cardio/Comida/Progreso) ---
     Cada caja pasa a fondo oscuro de marca con 2 estelas verdes cruzándola en diagonal (CSS puro,
     sin canvas extra por caja: rinde bien aunque haya muchas cajas en pantalla). Al redefinir las
     variables --card/--border/--txt* DENTRO de cada caja, todo lo que ya usaba esas variables
     (inputs, texto, subtítulos) se adapta solo, sin tocar el marcado ni la lógica. Scopeado a
     body.silk-on: no afecta login, panel del coach ni el modal/sheet de ejercicios.
     Lista única vía :is() + nesting: antes esta misma lista de clases estaba repetida en
     6 selectores separados (family, ::before/::after, el ::after ajustado, los hijos con
     z-index, y reduced-motion) — la causa real de --green, .food-name, .hb-name y
     .sess-item: se agregaba una card nueva a alguna de las 6 listas y no a las otras.
     Agregar una card nueva a la familia ahora es tocar esta única lista, una sola vez. */
  body.silk-on :is(.card, .hb-item, .food-row, .diary-item, .w-chart, .w-item, .water-card,
    .vol-card, .fi-card, .mc-block, .cardio-rx, .plan-banner, .join-box, .daynotes,
    .daily-card, .ci-card, .sess-item, .hx-row) {
    --card: #0d1b13; --card-2: #0a140e; --border: rgba(127,224,168,.22);
    --txt: #eafff2; --txt-2: #a9d9bd; --txt-3: #7fbf9c; --glow: rgba(51,196,129,.22);
    --shadow-card: 0 1px 2px rgba(0,0,0,.35), 0 3px 10px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.03);
    position: relative; overflow: hidden; isolation: isolate;
    background: linear-gradient(160deg, #0e1a13 0%, #0a140e 60%, #070d09 100%);
    &::before, &::after {
      content: ""; position: absolute; top: -10%; left: 50%; width: 90px; height: 1px;
      background: linear-gradient(90deg, #64e9a0, transparent);
      box-shadow: 0 0 0 1px rgba(255,255,255,.06);
      transform: rotate(215deg); transform-origin: left center;
      opacity: 0; z-index: 0; pointer-events: none;
      animation: cardMeteor 6s linear infinite;
    }
    &::after { left: 82%; width: 60px; animation-duration: 8s; animation-delay: 2.4s; }
    & > * { position: relative; z-index: 1; }
    @media (prefers-reduced-motion: reduce) {
      &::before, &::after { animation: none; opacity: 0; }
    }
  }
  /* .cal-search no es una "card" (sin fondo/borde propio, solo envuelve el input de
     búsqueda) — redefine únicamente las variables que su input ya usa, sin el resto
     del tratamiento de card de arriba (que le pondría un fondo/overflow que no le sirve). */
  body.silk-on .cal-search {
    --card-2: #0a140e; --border: rgba(127,224,168,.22); --txt: #eafff2; --txt-3: #7fbf9c;
  }
  @keyframes cardMeteor {
    0% { transform: rotate(215deg) translateX(0); opacity: 0; }
    4% { opacity: 1; }
    20% { opacity: 1; }
    28% { opacity: 0; }
    100% { transform: rotate(215deg) translateX(-220px); opacity: 0; }
  }

  /* ===== Estética del panel del coach — mismo lenguaje visual que el cliente =====
     Reusa el canvas de partículas (showSilkBg) y el estilo "Meteors" de cajas. Scopeado a
     body.silk-coach para no pisar la vista del cliente ni el login. Mismo criterio: las cajas
     redefinen --card/--border/--txt* internamente y todo lo de adentro se adapta solo. */

  /* --- Texto suelto del coach (sin card opaca detrás) --- */
  body.silk-coach .co-title, body.silk-coach .co-client-name,
  body.silk-coach .hb-title, body.silk-coach .co-brand .wordmark .w,
  body.silk-coach .co-onboard-lead { color: #eafff2; }
  body.silk-coach .co-brand-tag { color: #a9d9bd; }
  body.silk-coach .co-brand-dash { color: #7fbf9c; }
  body.silk-coach .co-sec, body.silk-coach .ci-f label, body.silk-coach .co-note-lbl,
  body.silk-coach .co-sub, body.silk-coach .cal-hint, body.silk-coach .ml-head,
  body.silk-coach .pl-help, body.silk-coach .foot { color: #a9d9bd; }
  body.silk-coach .pl-sub, body.silk-coach .ml-tot { color: #7fe0a8; }
  body.silk-coach .co-logout, body.silk-coach .co-back {
    color: #cdeedd; border-color: rgba(234,255,242,.28); background: rgba(255,255,255,.04); }
  body.silk-coach .co-logout:hover, body.silk-coach .co-back:hover { border-color: rgba(127,224,168,.55); color: #eafff2; }
  body.silk-coach .co-add-day, body.silk-coach .co-copy-btn, body.silk-coach .co-rt-add {
    color: #7fe0a8; border-color: rgba(127,224,168,.42); }
  body.silk-coach .co-day-del { color: #ff9b8f; border-color: rgba(255,155,143,.4); }

  /* --- Cajas del coach con el mismo tratamiento "Meteors" ---
     Misma consolidación vía :is() + nesting que el bloque del cliente arriba: una sola
     lista de clases en vez de repetida en 6 selectores separados. */
  body.silk-coach :is(.co-item, .co-exc, .co-invite, .opt-sec, .opt-item, .week-editor,
    .hx-row, .cp-ccard, .co-tab, .co-daytab, .ap-day, .cp-modal, .co-row, .co-slog,
    .ck-card, .sess-item) {
    --card: #0d1b13; --card-2: #0a140e; --border: rgba(127,224,168,.22);
    --txt: #eafff2; --txt-2: #a9d9bd; --txt-3: #7fbf9c; --glow: rgba(51,196,129,.22);
    position: relative; overflow: hidden; isolation: isolate;
    background: linear-gradient(160deg, #0e1a13 0%, #0a140e 60%, #070d09 100%);
    border-color: rgba(127,224,168,.22); color: #eafff2;
    box-shadow: 0 1px 2px rgba(0,0,0,.35), 0 3px 10px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.03);
    &::before, &::after {
      content: ""; position: absolute; top: -10%; left: 50%; width: 90px; height: 1px;
      background: linear-gradient(90deg, #64e9a0, transparent);
      box-shadow: 0 0 0 1px rgba(255,255,255,.06);
      transform: rotate(215deg); transform-origin: left center;
      opacity: 0; z-index: 0; pointer-events: none;
      animation: cardMeteor 6s linear infinite;
    }
    &::after { left: 82%; width: 60px; animation-duration: 8s; animation-delay: 2.4s; }
    & > * { position: relative; z-index: 1; }
    @media (prefers-reduced-motion: reduce) {
      &::before, &::after { animation: none; opacity: 0; }
    }
  }
  /* Bug de producción: .cp-modal y .cp-ccard son modales centrados con su propio
     position:fixed (ver sus reglas más abajo), pero la familia de arriba les pone
     position:relative como al resto — misma especificidad exacta que esta regla
     (body.silk-coach + 1 clase), así que sin este empate a favor de la que viene
     después en la hoja de estilos, "relative" le gana a "fixed" y el modal deja de
     ser un overlay: se renderiza en el flujo normal del documento, superpuesto con
     el contenido del panel debajo en vez de centrado en pantalla. */
  body.silk-coach .cp-modal, body.silk-coach .cp-ccard { position: fixed; }
  /* pestañas/estados activos mantienen el verde de marca */
  body.silk-coach .co-tab.on, body.silk-coach .co-daytab.on {
    background: var(--blue); border-color: var(--blue); color: #fff; }
  body.silk-coach .ap-day.on { border-color: rgba(127,224,168,.55); }

  /* --- Campos/controles sueltos del coach (sin card detrás): mismo tratamiento oscuro --- */
  body.silk-coach .co-note, body.silk-coach .co-search, body.silk-coach .co-dayname,
  body.silk-coach .ml-in, body.silk-coach .opt-body, body.silk-coach .bw {
    background: rgba(10,20,14,.72); border-color: rgba(127,224,168,.22); color: #eafff2; }
  body.silk-coach .co-note::placeholder, body.silk-coach .co-search::placeholder,
  body.silk-coach .co-dayname::placeholder, body.silk-coach .ml-in::placeholder,
  body.silk-coach .opt-body::placeholder { color: rgba(169,217,189,.5); }
  body.silk-coach .co-note:focus, body.silk-coach .co-search:focus, body.silk-coach .co-dayname:focus,
  body.silk-coach .ml-in:focus, body.silk-coach .opt-body:focus {
    outline: none; border-color: rgba(127,224,168,.5); background: rgba(14,26,19,.9); }
  body.silk-coach .bw.dl, body.silk-coach .bw.now { color: #fff; }
  body.silk-coach .co-exc-name, body.silk-coach .co-exc-btn {
    background: rgba(10,20,14,.6); border-color: rgba(127,224,168,.20); color: #eafff2; }
  /* .pl-help ya tiene su color cubierto arriba (lista de "texto suelto"); solo le
     faltaba el fondo, que no es parte de la familia "card" (sin meteors: es un
     cuadro de ayuda chico, no una card de contenido). */
  body.silk-coach .pl-help { background: rgba(10,20,14,.6); }
  /* fecha nativa legible sobre oscuro */
  body.silk-coach input[type="date"] { color-scheme: dark; }

  .topbar { position: relative; z-index: 1; display: flex; align-items: center; justify-content: space-between;
    max-width: 540px; margin: 0 auto; padding: calc(16px + env(safe-area-inset-top)) 16px 6px; }
  /* Bug de producción: .topbar es el header del CLIENTE (logo + nombre/"tu planilla") y no
     tiene nada que ver con el panel del coach — pero #coachHost es position:fixed;inset:0
     con background:transparent y su propio scroll interno (overflow-y:auto), independiente
     del document. .topbar, en cambio, vive en el documento base y no scrollea con él: queda
     fijo en pantalla mientras el contenido del coach se desliza por debajo, y como
     #coachHost no pinta nada opaco en esa franja superior, el header del cliente se ve *a
     través* — superpuesto con "‹ Volver" y los primeros campos. El coach ya tiene su propia
     cabecera (.co-head, con Volver/Actualizar/Salir), así que el header del cliente no debe
     mostrarse en absoluto mientras el panel del coach está activo. */
  body.silk-coach .topbar { display: none; }
  /* Mismo motivo que el bug de arriba: .navbar es la nav inferior del CLIENTE (Entreno/
     Hábitos/.../Ajustes) y no tiene nada que ver con el coach — la navegación del coach
     va por su propia cabecera (.co-head: ‹ Volver / Actualizar / Salir) y sus tabs
     internos (.co-tab/.co-daytab). Sin esto, al ser #coachHost transparente y con scroll
     propio, la nav de abajo se seguía viendo/tocando por debajo del panel del coach. */
  body.silk-coach .navbar { display: none; }
  /* Reemplazo sutil de la navbar en modo coach: no es navegación (la del coach va por
     .co-head y sus tabs internos), solo un indicador discreto de contexto — mismo
     lugar donde estaba la nav, mismo verde de marca, bien chico. pointer-events:none
     para no interceptar taps sobre el contenido que scrollea debajo. */
  #coachModeBadge {
    display: none; position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom));
    transform: translateX(-50%); z-index: 200; align-items: center; gap: 7px;
    padding: 7px 14px 7px 11px; border-radius: 20px; pointer-events: none;
    background: rgba(10,20,14,.85); border: 1px solid rgba(127,224,168,.32);
    color: #a9d9bd; font-size: var(--text-meta); font-weight: 700; letter-spacing: .02em;
    box-shadow: 0 4px 14px rgba(0,0,0,.35);
  }
  body.silk-coach #coachModeBadge { display: flex; }
  #coachModeBadge .cmb-dot {
    width: 7px; height: 7px; border-radius: 50%; background: #33c481; flex-shrink: 0;
    box-shadow: 0 0 6px rgba(51,196,129,.7); animation: cmbPulse 2.4s ease-in-out infinite;
  }
  @keyframes cmbPulse { 0%, 100% { opacity: .55; transform: scale(.85); } 50% { opacity: 1; transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) {
    #coachModeBadge .cmb-dot { animation: none; opacity: 1; }
  }
  .brand { display: flex; align-items: center; gap: 11px; }
  .brand-ic { width: 40px; height: 40px; border-radius: 4px; background: linear-gradient(135deg, #185c37, #33c481);
    display: flex; align-items: center; justify-content: center; box-shadow: var(--glow-lg), inset 0 1px 0 rgba(255,255,255,.3); }

  .view { position: relative; z-index: 1; max-width: 540px; margin: 0 auto; padding: 10px 16px calc(112px + env(safe-area-inset-bottom)); }

  .tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { padding: 8px 16px; border-radius: 4px; font-size: var(--text-body); white-space: nowrap; flex-shrink: 0;
    background: var(--card); border: 1px solid var(--border); color: var(--txt-2); cursor: pointer; transition: color .3s ease, border-color .3s ease;
    position: relative; overflow: hidden; isolation: isolate; --gx: 50%; --gy: 50%; }
  .tab.active { background: var(--blue); color: #fff; border-color: var(--blue); box-shadow: var(--glow-md); }
  .tab-add { color: var(--blue-2); font-weight: 700; border-style: dashed; }
  /* --- Hover-glow + ripple (botones de la fila de días, ej. Torso/Piernas/…) ---
     Adaptado de HoverButton + RippleButton en verde de marca. El glow sigue al mouse
     (posición vía --gx/--gy seteadas por JS en mousemove) y el ripple es un span JS
     por click, ambos por detrás del texto (z-index:-1, contenidos por isolation:isolate). */
  .tab::before {
    content: ""; position: absolute; left: var(--gx); top: var(--gy); width: 90px; height: 90px;
    margin: -45px 0 0 -45px; border-radius: 50%; z-index: -1; pointer-events: none;
    background: radial-gradient(circle, rgba(51,196,129,.55) 10%, transparent 72%);
    opacity: 0; transform: scale(.4); transition: opacity .3s ease, transform .4s ease;
  }
  .tab:hover::before { opacity: 1; transform: scale(1.5); }
  .tab:hover { color: #7fe0a8; }
  .tab.active:hover { color: #eafff2; }
  .tab .tab-ripple { position: absolute; border-radius: 50%; z-index: -1; pointer-events: none;
    background: rgba(51,196,129,.45); transform: scale(0); animation: tabRippleAnim .5s ease-out forwards; }
  .tab.active .tab-ripple { background: rgba(255,255,255,.35); }
  @keyframes tabRippleAnim { to { transform: scale(1); opacity: 0; } }
  @media (hover: none) { .tab::before { display: none; } }
  @media (prefers-reduced-motion: reduce) { .tab::before { transition: opacity .15s linear; } .tab-ripple { animation: none; opacity: 0; } }

  .day-head { margin: 16px 0 20px; }
  .day-top { display: flex; align-items: center; gap: 8px; }
  .day-name { flex: 1; min-width: 0; background: transparent; border: none; color: var(--txt);
    font-size: 26px; font-weight: 700; letter-spacing: -0.02em; padding: 2px 4px; border-radius: 4px; }
  .day-name:focus { outline: none; background: var(--card); }

  .day-del:active { color: var(--red); }
  .day-sub { width: 100%; background: transparent; border: none; color: var(--txt-2); font-size: var(--text-body); padding: 2px 4px; border-radius: 4px; margin-top: 2px; }
  .day-sub:focus { outline: none; background: var(--card); }

  .progress-row { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
  .bar { flex: 1; height: 8px; border-radius: 4px; background: var(--card-2); overflow: hidden; }
  .bar > div { height: 100%; background: linear-gradient(90deg, #217346, #33c481); box-shadow: var(--glow-sm); transition: width .25s; }
  .count { font-size: var(--text-body); color: var(--txt-2); font-variant-numeric: tabular-nums; flex-shrink: 0; }
  /* Antes era un link subrayado suelto sobre el fondo de partículas — se perdía visualmente
     ahí (mismo problema que ya resolvimos para .co-invite: elemento chico sin caja propia
     sobre un fondo con textura). Ahora tiene chrome de botón chico (fondo/borde/padding),
     mismo lenguaje que ya usan los botones ghost chicos de la app (.load-def, .co-copy-btn). */
  .clear { font-size: var(--text-meta); font-weight: 600; color: var(--txt-3); background: transparent;
    border: 1px solid var(--border); border-radius: 4px; padding: 6px 11px; cursor: pointer;
    text-decoration: none; flex-shrink: 0; transition: var(--transition-tap); }
  .clear:hover { border-color: var(--blue-2); color: var(--blue-2); }
  .clear:active { color: var(--txt); background: var(--card-2); }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: 4px; padding: var(--space-16); margin-bottom: var(--space-12);
    opacity: .45; transform: scale(.90);
    transition: opacity var(--duration-frequent) var(--ease-drawer), transform var(--duration-frequent) var(--ease-drawer); }
  .ex-collapsed { display: flex; align-items: center; gap: var(--space-10); background: var(--card); border: 1px solid var(--border);
    border-radius: 4px; padding: var(--space-12) var(--space-14); margin-bottom: var(--space-12); cursor: pointer;
    opacity: .45; transform: scale(.90);
    transition: opacity var(--duration-frequent) var(--ease-drawer), transform var(--duration-frequent) var(--ease-drawer); }
  .ex-collapsed-badge { flex-shrink: 0; color: var(--green); display: flex; }
  .ex-collapsed-badge svg { width: var(--icon-md); height: var(--icon-md); }
  .ex-collapsed-name { flex: 1; min-width: 0; font-weight: 700; color: var(--txt); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ex-collapsed-best { flex-shrink: 0; font-family: var(--font-mono); font-size: var(--text-meta); color: var(--txt-2); font-variant-numeric: tabular-nums; }
  /* Foco de scroll: la card/fila que cruza la banda central del viewport se ve a pleno,
     el resto queda atenuado (opacity .6 / scale .96, deliberadamente sutil — tiene que
     seguir siendo legible mientras el cliente descansa y mira qué sigue). */
  .card.ex-focused, .ex-collapsed.ex-focused { opacity: 1; transform: scale(1); }
  /* .ex-collapsing siempre gana el empate con .ex-focused (misma especificidad, define
     después en la cascada): si justo se está colapsando, eso manda sobre el foco. */
  .card.ex-collapsing { opacity: 0; transform: scale(.97) translateY(-4px); pointer-events: none; }
  @media (prefers-reduced-motion: reduce) {
    .card, .ex-collapsed { opacity: 1 !important; transform: none !important; }

  .card-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }

  /* Cardio */
  .cardio-modes { display: flex; gap: 8px; margin: 8px 0 8px; }
  .cmode { flex: 1; padding: 11px; border-radius: 4px; background: var(--card); border: 1px solid var(--border); color: var(--txt-2); font-size: var(--text-body); font-weight: 600; cursor: pointer; text-align: center; }
  .cmode.active { background: var(--blue); color: #fff; border-color: var(--blue); box-shadow: var(--glow-md); }
  /* Corredor/reloj de arena animado (SMIL): aparece debajo de los controles mientras el
     cronómetro o el temporizador están corriendo — corredor para el cronómetro, reloj de
     arena para el temporizador. Arranca/pausa unas pocas veces por sesión de cardio (no en
     cada tick), por eso --duration-standard en vez de --duration-frequent; misma curva
     --ease-drawer que el resto de las entradas de la app. */
  .cardio-runner { display: flex; justify-content: center; margin: var(--space-16) 0 var(--space-4);
    animation: runnerIn var(--duration-standard) var(--ease-drawer); }
  .cardio-runner svg { width: 96px; height: 96px; filter: drop-shadow(0 0 14px var(--glow)); }

  @media (prefers-reduced-motion: reduce) { .cardio-runner { display: none; } }

  /* Comida / Calorías */

  #foodResults { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }

  .food-row:active { background: var(--card-2); }

    color: var(--blue-2); background: transparent; cursor: pointer; border: 1px dashed var(--border); border-radius: 4px; padding: 11px; }
  .cal-create:active { border-color: var(--blue); }

  .sheet-bg { position: fixed; inset: 0; z-index: 59; background: rgba(0,0,0,.55);

  @starting-style { .sheet-bg { opacity: 0; } }

  /* ===== Revelado por scroll: cualquier bloque marcado con [data-reveal] arranca oculto y
     corrido hacia abajo, y sube a su lugar con fade apenas entra en pantalla (ver
     initScrollReveal()/revealedBlocks en el JS). Portado desde App-gym.html (variante WHOOP)
     a pedido — aplicado en Entreno solo al encabezado del día y a las notas del coach, a
     propósito NO a las cards de ejercicio: esas ya tienen su propio efecto de foco por scroll
     (setupExerciseFocus/.ex-focused), que controla opacity/transform con sus propios valores
     de reposo (opacity .6, scale .96). Si la card también fuera [data-reveal], el estado
     "revelado" de esta regla (opacity:1, sin transform) pisaría el estado "no enfocado" de esa
     otra la primera vez que la card entra en pantalla — y como el reveal es de una sola vez,
     la card quedaría a pleno para siempre después de la primera vez que se vio, arruinando el
     dimming. Mismo motivo por el que esta regla nunca fija "transform" en el estado revelado:
     si lo hiciera, competiría por especificidad con cualquier otro estado que sí necesite
     tocar transform en ese bloque (ver .card.ex-focused). Es una sola vez por bloque: como
     renderApp() recrea el DOM entero en cada toggle de serie/kg/reps, sin esa memoria la
     animación se repetiría en cada tap del check mientras entrenás. */

// El anillo de calorías se recrea entero en cada renderApp() (todo el HTML de la vista se
// reemplaza), así que la transición CSS del círculo nunca tiene un valor "anterior" del cual
// partir — el navegador lo pinta directo en el valor final. Para que se vea gradual, lo
// llevamos manualmente al offset/color previo (sin transición) y recién al frame siguiente
// lo soltamos al valor real, dejando que la transición de .ring-fill (.4s, ver CSS) haga el
// resto. El número de kcal se anima aparte con un count-up por rAF, misma duración que el
// arco (.4s) para que se sientan como una sola animación en vez de dos cosas independientes.
let calRingPrevOffset = null, calRingPrevOver = null, calRingPrevKcal = null, calRingNumRaf = null;
function animateCalRing(){
  const circle = document.getElementById("calRing");
  if (!circle) return;
  const target = circle.style.strokeDashoffset;
  const isOver = circle.classList.contains("over");
  if (calRingPrevOffset !== null) {
    circle.style.transition = "none";
    circle.style.strokeDashoffset = calRingPrevOffset;
    circle.classList.toggle("over", calRingPrevOver);
    void circle.getBoundingClientRect();
    circle.style.transition = "";
    requestAnimationFrame(()=>{
      circle.style.strokeDashoffset = target;
      circle.classList.toggle("over", isOver);
    });
  }
  calRingPrevOffset = target;
  calRingPrevOver = isOver;

  const numEl = document.getElementById("calRingNum");
  if (!numEl) return;
  const targetKcal = parseInt(numEl.dataset.val, 10) || 0;
  const fromKcal = calRingPrevKcal;
  calRingPrevKcal = targetKcal;
  if (fromKcal === null || fromKcal === targetKcal) return;
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  if (calRingNumRaf) cancelAnimationFrame(calRingNumRaf);
  const dur = 400, t0 = performance.now(); // igual a la transition-duration de .ring-fill
  const ease = x => 1 - Math.pow(1 - x, 3); // easeOutCubic: misma "desaceleración rápida" que --ease-drawer,
                                             // aproximada a mano porque un cubic-bezier() de CSS no se puede
                                             // evaluar directo dentro de un loop de rAF sin un solver aparte.
  const step = now => {
    const p = Math.min(1, (now - t0) / dur);
    numEl.textContent = Math.round(fromKcal + (targetKcal - fromKcal) * ease(p));
    if (p < 1) calRingNumRaf = requestAnimationFrame(step);
    else { numEl.textContent = targetKcal; calRingNumRaf = null; }
  };
  calRingNumRaf = requestAnimationFrame(step);
}

  const g = {bajar:0.8,mantener:1.0,ganar:1.1}[p.goal] || 1.0;

}

function onMotion(e){
  const a = e.accelerationIncludingGravity; if(!a) return;
  const mag = Math.sqrt((a.x||0)*(a.x||0)+(a.y||0)*(a.y||0)+(a.z||0)*(a.z||0));
  lpf = lpf*0.9 + mag*0.1;
  const dyn = mag - lpf, now = Date.now();
  if (dyn>1.2 && prevDyn<=1.2 && (now-lastStepTs)>300){
    state.steps = (state.steps||0)+1; lastStepTs=now;
    const el=document.getElementById("stepNum"); if(el) el.textContent=(state.steps).toLocaleString("es-AR");
    const ring=document.getElementById("stepRing"); if(ring){ const g=state.stepsGoal||10000; ring.style.strokeDashoffset = RC*(1-Math.min(state.steps/g,1)); }
    if(now-stepsSaveTs>3000){ save(); stepsSaveTs=now; }
  }
  prevDyn = dyn;
}
async function startLive(){
  try{
    if (typeof DeviceMotionEvent!=="undefined" && typeof DeviceMotionEvent.requestPermission==="function"){
      const res = await DeviceMotionEvent.requestPermission();
      if (res!=="granted"){ alert("Necesito permiso de movimiento para contar pasos."); return; }
    }
    window.addEventListener("devicemotion", onMotion);
    liveCounting=true; renderApp();
  }catch(err){ alert("Tu dispositivo no permite usar el sensor de movimiento en el navegador."); }
}
function stopLive(){ try{ window.removeEventListener("devicemotion", onMotion); }catch(e){} liveCounting=false; save(); renderApp(); }

function renderEntreno(){
  const d = day();
  const total = d.exercises.reduce((a,e)=>a+e.sets.length,0);
  const done = d.exercises.reduce((a,e)=>a+e.sets.filter(s=>s.done).length,0);
  const pct = total ? Math.round(done/total*100) : 0;
  const tabs = state.days.map(x =>
    `<button class="tab${x.id===activeId?' active':''}" data-action="tab" data-day="${x.id}">${esc(x.name)}</button>`
  ).join("") + (routineLocked() ? "" : `<button class="tab tab-add" data-action="addday" title="Agregar día">+</button>`);
  // Un solo ejercicio roto no debe tumbar toda la vista de Entreno: v.innerHTML= es una
  // sola asignación, así que si CUALQUIER ejercicio revienta acá adentro, renderApp() se
  // corta a la mitad, #view queda vacío y la nav no vuelve a responder (ver el bug de
  // .kg/.reps sobre bestSetOf()===null, ya arreglado arriba, pero esto es la red de
  // seguridad para lo que no prevemos). Cada ejercicio se renderiza en su propio try/catch:
  // si uno falla, muestra una card de error puntual y el resto del día se ve normal.
  const cards = d.exercises.map((ex, exIdx) => { try {
    const insertBtn = routineLocked()?'':`<button class="ins-ex" data-action="ex-insert" data-i="${exIdx}" title="Insertar ejercicio acá">+</button>`;
    const done = allSetsDone(ex);
    // Ejercicio completo y no reabierto a mano -> fila compacta, no la card entera.
    if(done && !expandedOverride.has(ex.id)){
      const best=bestSetOf(ex.sets);
      const isPR=exerciseIsLivePR(ex);
      // bestSetOf() da null si ningún set tiene kg cargado (ej.: ejercicio de peso
      // corporal donde el cliente solo anota reps) — antes esto reventaba renderEntreno()
      // entero (best.kg sobre null) y dejaba la pestaña Entreno en blanco. Con reps
      // mostramos el mejor número de reps en su lugar; sin ninguno de los dos, "Completado".
      let bestReps=0; (ex.sets||[]).forEach(s=>{ const r=+s.reps||0; if(r>bestReps) bestReps=r; });
      const bestStr = best ? (best.kg+' kg × '+best.reps) : (bestReps>0 ? bestReps+' reps' : 'Completado');
      return `${insertBtn}<div class="ex-collapsed${exIdx===0?' ex-focused':''}" data-action="ex-expand" data-ex="${ex.id}">
        <span class="ex-collapsed-badge">${isPR?trophySvg:checkSvg}</span>
        <span class="ex-collapsed-name">${esc(ex.name)}</span>
        <span class="ex-collapsed-best">${bestStr}</span>
      </div>`;
    }
    const sets = ex.sets.map((s,i) => `
      <div class="set">
        <span class="idx">${i+1}</span>
        <div class="field"><input class="kg" type="text" inputmode="decimal" placeholder="0" value="${esc(s.kg)}" data-action="kg" data-ex="${ex.id}" data-set="${s.id}"><span class="unit">kg</span></div>
        <div class="field"><input class="reps" type="text" inputmode="numeric" placeholder="0" value="${esc(s.reps)}" data-action="reps" data-ex="${ex.id}" data-set="${s.id}"><span class="unit">reps</span></div>
        ${s.target?`<span class="goal" title="Objetivo del coach">${esc(s.target)}</span>`:''}
        <button class="done${s.done?' on':''}" data-action="toggle" data-ex="${ex.id}" data-set="${s.id}">${s.done?checkSvg:''}</button>
        ${routineLocked()?'':`<button class="rm" data-action="removeset" data-ex="${ex.id}" data-set="${s.id}" title="Quitar serie">${xSvg}</button>`}
      </div>`).join("");
    return `${insertBtn}<div class="card${exIdx===0?' ex-focused':''}" data-ex-id="${ex.id}">
      <div class="card-head">
        <input class="ex-name" type="text" value="${esc(ex.name)}" data-action="exname" data-ex="${ex.id}" ${routineLocked()?'readonly':''}>
        ${done?`<button class="icon-mini" data-action="ex-collapse" data-ex="${ex.id}" title="Colapsar">${chevronDownSvg}</button>`:''}
        ${routineLocked()?'':`<button class="icon-mini" data-action="ex-swap" data-ex="${ex.id}" title="Cambiar ejercicio">${swapSvg}</button>
        <button class="trash" data-action="removeex" data-ex="${ex.id}" title="Eliminar ejercicio">${trashSvg}</button>`}
      </div>
      ${ex.video?`<a class="ex-video" href="${esc(ex.video)}" target="_blank" rel="noopener">${playSvg} Ver video del ejercicio</a>`:''}
      ${(ex.o||ex.rir||ex.goal)?`<div class="ex-prog">
        ${ex.o?`<span class="ep-ord">${esc(ex.o)}</span>`:''}
        ${ex.rir?`<span class="ep-chip">RIR ${esc(ex.rir)}</span>`:''}
        ${ex.goal?`<span class="ep-goal">${esc(ex.goal)}</span>`:''}
      </div>`:''}
      ${renderLastSession(ex.name)}
      ${sets}
      ${ex.note?`<div class="ex-note"><span class="ex-note-t">Nota de tu coach</span>${esc(ex.note)}</div>`:''}
      ${routineLocked()?'':`<button class="add-set" data-action="addset" data-ex="${ex.id}">+ Serie</button>`}
      ${ex.rest?`<button class="rest-btn-full" data-action="rest-from-ex" data-sec="${parseRest(ex.rest)}"><span class="rbf-play">${playSvg} Iniciar descanso</span><span class="rbf-time">${esc(ex.rest)}</span></button>`:''}
    </div>`;
  } catch(err) {
    // Ojo acá: si lo que reventó fue justo leer una propiedad de ex (ex.name, ex.id),
    // volver a leerla para armar el mensaje de error vuelve a tirar, esta vez sin nadie
    // que lo atajé. Cada lectura de ex.* en este catch va en su propio try chico.
    let safeName = "Ejercicio", safeId = "";
    try { safeName = ex && ex.name ? String(ex.name) : safeName; } catch(e2) {}
    try { safeId = ex && ex.id ? String(ex.id) : safeId; } catch(e2) {}
    console.error("renderEntreno: error al renderizar el ejercicio", safeId, safeName, err);
    return `<div class="card"><div class="card-head"><span class="ex-name" style="color:var(--red)">⚠ ${esc(safeName)} — no se pudo mostrar</span></div></div>`;
  } }).join("");
  return `
    ${renderBlockBanner()}
    ${routineLocked()?'<div class="coach-banner">Rutina asignada por tu coach</div>':''}
    <div class="tabs">${tabs}</div>
    <div class="day-head" data-reveal="dayhead-${d.id}">
      <div class="day-top">
        <input class="day-name" type="text" value="${esc(d.name)}" data-action="dayname" ${routineLocked()?'readonly':''}>
        ${routineLocked()?'':`<button class="day-del" data-action="delday" title="Eliminar día">${trashSvg}</button>`}
      </div>
      <input class="day-sub" type="text" value="${esc(d.subtitle)}" placeholder="Grupos musculares…" data-action="subtitle" ${routineLocked()?'readonly':''}>
      <div class="progress-row">
        <div class="bar"><div style="width:${pct}%"></div></div>
        <span class="count">${done}/${total} series</span>
        <button class="clear" data-action="clear">Limpiar</button>
      </div>
    </div>
    ${cards || '<div class="empty">Día vacío.<br>' + (routineLocked()?'Tu coach todavía no te cargó ejercicios.':'Agregá ejercicios acá abajo 👇') + '</div>'}
    ${routineLocked()?'':'<button class="add-ex" data-action="ex-add-open">+ Agregar ejercicio</button>'}
    ${renderDayNotes(d)}
    ${d.exercises.length ? '<button class="save-session" data-action="save-session">'+checkSvg+' Guardar entreno de hoy</button>' : ''}
    ${routineLocked() ? '' : '<button class="load-def" data-action="load-default-routine">'+resetSvg+' Cargar Meso 2 · Microciclo 8</button>'}
    <p class="foot">${cloudUser ? 'Sincronizado con tu cuenta' : 'Se guarda solo en este dispositivo'}</p>`;
}

function renderCardio(){
  const modes = `<div class="cardio-modes">
    <button class="cmode${cardioMode==='stopwatch'?' active':''}" data-action="cardio-mode" data-mode="stopwatch">Cronómetro</button>
    <button class="cmode${cardioMode==='timer'?' active':''}" data-action="cardio-mode" data-mode="timer">Temporizador</button>
  </div>`;
  const rx = renderCardioPrescription();
  const tools = renderCardioTools(modes);
  return rx + '<div class="cardio-toolsec"><div class="cardio-tools-h">Cronómetro y temporizador</div>' + tools + '</div>';
}
function renderCardioTools(modes){
  if (cardioMode === "stopwatch") {
    const elapsed = swRunning ? swAccum + (Date.now()-swStartTs) : swAccum;
    const laps = swLaps.length ? `<div class="laps">${swLaps.map((t,i)=>({t,i})).reverse().map(o=>`<div class="lap"><span>Vuelta ${o.i+1}</span><span>${fmt(o.t)}</span></div>`).join("")}</div>` : "";
    const runner = swRunning ? `<div class="cardio-runner">${RUNNER_SVG}</div>` : "";
    return modes + `
      <div class="time-display" id="swTime">${fmt(elapsed)}</div>
      <div class="ctrl-row">
        <button class="ctrl ${swRunning?'ghost':'primary'}" data-action="sw-toggle">${swRunning?'Pausar':'Iniciar'}</button>
        ${swRunning?'<button class="ctrl ghost" data-action="sw-lap">Vuelta</button>':''}
        <button class="ctrl ghost" data-action="sw-reset">Reiniciar</button>
      </div>
      ${runner}${laps}`;
  } else {
    const rem = tmRunning ? Math.max(0, tmEndTs-Date.now()) : tmRemainingMs;
    const presetVals = [30,60,90,120,180,300];
    const editable = !tmRunning && !tmFinished;
    const cm = Math.floor(tmTarget/60000), cs = Math.floor((tmTarget%60000)/1000);
    const editor = editable ? `
      <div class="presets">${presetVals.map(v=>`<button class="preset${tmTarget===v*1000?' on':''}" data-action="tm-preset" data-sec="${v}">${fmt(v*1000)}</button>`).join("")}</div>
      <div class="custom-time">
        <input id="tmMin" class="ct-input" type="text" inputmode="numeric" maxlength="3" value="${cm}" data-action="tm-min">
        <span class="ct-colon">:</span>
        <input id="tmSec" class="ct-input" type="text" inputmode="numeric" maxlength="2" value="${String(cs).padStart(2,'0')}" data-action="tm-sec">
      </div>
      <div class="ct-hint">minutos : segundos — personalizá lo que quieras</div>` : "";
    let ctrls;
    if (tmRunning) ctrls = '<button class="ctrl ghost" data-action="tm-toggle">Pausar</button><button class="ctrl ghost" data-action="tm-reset">Reiniciar</button>';
    else if (tmFinished) ctrls = '<button class="ctrl primary" data-action="tm-reset">Reiniciar</button>';
    else ctrls = '<button class="ctrl primary" data-action="tm-toggle">Iniciar</button>';
    const hourglass = tmRunning ? `<div class="cardio-runner">${HOURGLASS_SVG}</div>` : "";
    return modes + `
      <div class="time-display${tmFinished?' finished':''}" id="tmTime">${tmFinished?'00:00':fmt(rem,true)}</div>
      ${editor}
      <div class="ctrl-row">${ctrls}</div>
      ${hourglass}`;
  }
}

}

function fmtDate(d){ const p=(d||"").split("-"); if(p.length!==3) return d; const m=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"]; return parseInt(p[2],10)+" "+(m[parseInt(p[1],10)-1]||""); }
function fmtDInput(d){ const p=(d||"").split("-"); if(p.length!==3) return d; return p[2]+"/"+p[1]+"/"+p[0]; }
function renderWChart(ws, evenX, sz){
  const S = sz==="mini" ? {W:320,H:130,pl:36,pr:10,pt:12,pb:22,FS:9,DR:3.5,DR2:2.5,SW:2}
          : sz==="med"  ? {W:560,H:210,pl:46,pr:14,pt:16,pb:26,FS:11,DR:5,DR2:3.5,SW:2.5}
          : {W:340,H:180,pl:40,pr:14,pt:16,pb:24,FS:9,DR:4,DR2:3,SW:2.5};
  const W=S.W,H=S.H,pl=S.pl,pr=S.pr,pt=S.pt,pb=S.pb, plotW=W-pl-pr, plotH=H-pt-pb;
  const FS=S.FS, DR=S.DR, DR2=S.DR2, SW=S.SW;
  const times=ws.map(e=>new Date(e.date+"T00:00:00").getTime());
  const kgs=ws.map(e=>e.kg);
  let minK=Math.min.apply(null,kgs), maxK=Math.max.apply(null,kgs);
  if(maxK-minK < 0.0001){ minK-=0.5; maxK+=0.5; }
  const NICE=[0.2,0.25,0.5,1,1.25,1.5,2,2.5,5,10,20,25,50,100,200,250,500];
  let stepK=NICE[NICE.length-1];
  const TGT = (sz==="mini") ? 2.5 : 4;
  for(let i=0;i<NICE.length;i++){ if((maxK-minK)/NICE[i] <= TGT){ stepK=NICE[i]; break; } }
  let loK=Math.floor(minK/stepK)*stepK; if(minK-loK < stepK*0.2) loK-=stepK;
  let hiK=Math.ceil(maxK/stepK)*stepK; if(hiK-maxK < stepK*0.2) hiK+=stepK;
  const decK=(String(stepK).split(".")[1]||"").length;
  const nTicks=Math.round((hiK-loK)/stepK);
  const minT=Math.min.apply(null,times), maxT=Math.max.apply(null,times), tRange=maxT-minT;
  const useEven = evenX || !tRange;
  const X=(t,i)=> ws.length<2 ? pl+plotW/2 : (useEven ? pl+(i/(ws.length-1))*plotW : pl+((t-minT)/tRange)*plotW);
  const Y=k=> pt+(1-(k-loK)/(hiK-loK))*plotH;
  const pts=ws.map((e,i)=>({x:X(times[i],i),y:Y(e.kg)}));
  const line=pts.map((p,i)=>(i?"L":"M")+p.x.toFixed(1)+" "+p.y.toFixed(1)).join(" ");
  const baseY=(pt+plotH).toFixed(1);
  const area=pts.length>1 ? "M"+pts[0].x.toFixed(1)+" "+baseY+" "+pts.map(p=>"L"+p.x.toFixed(1)+" "+p.y.toFixed(1)).join(" ")+" L"+pts[pts.length-1].x.toFixed(1)+" "+baseY+" Z" : "";
  const yVals=[]; for(let i=0;i<=nTicks;i++) yVals.push(loK+i*stepK);
  const grid=yVals.map(v=>{const y=Y(v).toFixed(1);return '<line x1="'+pl+'" y1="'+y+'" x2="'+(W-pr)+'" y2="'+y+'" stroke="#4e4f4b" stroke-width="1"/><text x="'+(pl-8)+'" y="'+(parseFloat(y)+FS/3).toFixed(1)+'" fill="#747877" font-size="'+FS+'" text-anchor="end">'+v.toFixed(decK)+'</text>';}).join("");
  const dots=pts.map((p,i)=>'<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="'+(i===pts.length-1?DR:DR2)+'" fill="'+(i===pts.length-1?'#d2d6d8':'#747877')+'"/>').join("");
  const xl='<text x="'+pl+'" y="'+(H-6)+'" fill="#747877" font-size="'+FS+'" text-anchor="start">'+fmtDate(ws[0].date)+'</text>'+(ws.length>1?'<text x="'+(W-pr)+'" y="'+(H-6)+'" fill="#747877" font-size="'+FS+'" text-anchor="end">'+fmtDate(ws[ws.length-1].date)+'</text>':'');
  return '<div class="w-chart"><svg viewBox="0 0 '+W+' '+H+'" width="100%"><defs><linearGradient id="wg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#747877"/><stop offset="1" stop-color="#747877" stop-opacity="0"/></linearGradient></defs>'+grid+(area?'<path d="'+area+'" fill="url(#wg)" opacity="0.3"/>':'')+(pts.length>1?'<path d="'+line+'" fill="none" stroke="#d2d6d8" stroke-width="'+SW+'" stroke-linecap="round" stroke-linejoin="round"/>':'')+dots+xl+'</svg></div>';
}

function migrateNames(days){
  let changed=false;
  (days||[]).forEach(d=>{
    if(ES_DAYS[d.name]){ d.name=ES_DAYS[d.name]; changed=true; }
    (d.exercises||[]).forEach(ex=>{
      if(ES_MAP[ex.name]){ ex.name=ES_MAP[ex.name]; changed=true; }
      if(!ex.mus || !EX_DB[ex.mus]){ const m=muscleOf(ex.name); if(m!=="otros"){ ex.mus=m; changed=true; } }

  });
  return changed;
}

function loadSeriesFor(name){
  const out=[];
  (state.sessions||[]).slice().sort((a,b)=>(a.ts||0)-(b.ts||0)).forEach(se=>{
    let mx=0; (se.exercises||[]).forEach(ex=>{ if(ex.name===name) (ex.sets||[]).forEach(s=>{ const k=+s.kg||0; if(k>mx) mx=k; }); });
    if(mx>0) out.push({date:se.date, kg:mx});
  });
  return out;

// Mejor kg histórico de un ejercicio, considerando solo sesiones YA guardadas
// (nunca la que se está por guardar). null si el ejercicio no tiene historial previo.
function bestKgBefore(exName, priorSessions){
  let best=null;
  (priorSessions||[]).forEach(se=>{
    (se.exercises||[]).forEach(ex=>{
      if(ex.name!==exName) return;
      (ex.sets||[]).forEach(s=>{
        const kg=+s.kg||0;
        if(kg>0 && (best===null || kg>best)) best=kg;
      });
    });
  });
  return best;
}
// El set con mayor kg de una lista (kg=0 no cuenta). null si ninguno tiene kg cargado.
function bestSetOf(sets){
  let best=null;
  (sets||[]).forEach(s=>{
    const kg=+s.kg||0;
    if(kg>0 && (!best || kg>best.kg)) best=s;
  });
  return best;
}
// Compara el mejor set de cada ejercicio de la sesión nueva contra bestKgBefore.
// Estricto a propósito: superar (kg > prev) es récord; igualar no lo es, y un
// ejercicio sin historial previo tampoco (si no, todo ejercicio nuevo "rompería
// récord" en su primera vez, vaciando de sentido el cartel).
function detectPRs(newExercises, priorSessions){
  const prs=[];
  (newExercises||[]).forEach(ex=>{
    const bestSet=bestSetOf(ex.sets);
    if(!bestSet) return;
    const prev=bestKgBefore(ex.name, priorSessions);
    if(prev===null) return;
    if(bestSet.kg>prev) prs.push({name:ex.name, kg:bestSet.kg, reps:bestSet.reps, prev:prev});
  });
  return prs;
}
// Un ejercicio está "completo" cuando tiene al menos una serie y todas están tildadas.
function allSetsDone(ex){ return (ex.sets||[]).length>0 && ex.sets.every(s=>s.done); }
// Mismo criterio estricto de detectPRs, pero evaluado en vivo (mid-entreno, contra
// el historial ya guardado) para decidir si la fila colapsada muestra el trofeo.
function exerciseIsLivePR(ex){
  const best=bestSetOf(ex.sets);
  if(!best) return false;
  const prev=bestKgBefore(ex.name, state.sessions);
  return prev!==null && best.kg>prev;
}

let sheetGen = 0;
// Anima el cierre de un panel (bottom sheet o modal centrado del coach) antes de que
// el render que lo controla lo destruya vía innerHTML: agrega .closing (dispara la
// transición CSS del propio panel) y recién entonces corre la mutación real de estado.
// sheetGen invalida un cierre pendiente si mientras tanto se abrió otro panel (el
// backdrop queda pointer-events:none al cerrar, así que un click de abajo puede llegar
// a un botón que reabra antes de que termine la transición).
// opts: { host: selector del contenedor (default "#sheetHost"),
//         card: selector del panel a animar (default ".sheet"),
//         duration: ms, debe matchear la transition-duration del CSS (default 220) }
function closeSheet(mutate, opts){
  opts = opts || {};
  const host = opts.host || "#sheetHost";
  const card = opts.card || ".sheet";
  const duration = opts.duration || 220;
  const root = document.querySelector(host);
  const cardEl = root && root.querySelector(card);
  const bgEl = root && root.querySelector(".sheet-bg, .cp-bg");
  const reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(!cardEl || reduced){ sheetGen++; mutate(); return; }
  cardEl.classList.add("closing");
  if(bgEl) bgEl.classList.add("closing");
  const gen = ++sheetGen;
  setTimeout(()=>{ if(gen===sheetGen) mutate(); }, duration);
}
// Anima la card de un ejercicio achicándose antes de que renderApp() la reemplace
// por la fila colapsada — mismo motivo que closeSheet: la vista entera se reconstruye
// por innerHTML en cada render, así que no hay forma segura de animar la ENTRADA de
// la fila compacta (se re-dispararía en cualquier toggle ajeno). Solo se anima la
// salida, sobre el nodo que todavía existe.
// Bug de producción (crítico): esto usaba sheetGen, el mismo contador que closeSheet.
// sheetGen asume "como mucho un panel abierto/cerrándose a la vez" — válido para sheets,
// pero acá pueden estar colapsando VARIOS ejercicios distintos al mismo tiempo (ej.:
// el cliente completa el último set de dos ejercicios seguidos, a menos de 150ms de
// diferencia). El segundo colapso incrementaba el contador compartido e invalidaba el
// gen que el primero ya había capturado — su after() (que es renderApp) nunca corría,
// y esa card quedaba con .ex-collapsing (opacity:0, pointer-events:none) para siempre,
// hasta que algo totalmente ajeno disparara un render por otro motivo. Fix: un contador
// propio por exId, independiente de sheetGen — un colapso de un ejercicio ya no puede
// invalidar el de otro, ni verse invalidado por abrir/cerrar un sheet sin relación.
let collapseGen = {};
function collapseExerciseAnimated(exId, after){
  const reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const card = document.querySelector('.card[data-ex-id="'+exId+'"]');
  if(!card || reduced){ after(); return; }
  card.classList.add("ex-collapsing");
  const gen = (collapseGen[exId] = (collapseGen[exId]||0) + 1);
  setTimeout(()=>{ if(collapseGen[exId]===gen) after(); }, 150);
}

// Revelado por scroll para cualquier bloque marcado con [data-reveal] (ver CSS) — hoy
// el encabezado del día y las notas del coach en Entreno, a propósito no las cards de
// ejercicio (esas ya tienen su propio efecto de foco, ver setupExerciseFocus más abajo).
// revealedBlocks persiste entre renders (no se resetea en renderApp): así, cuando tocás
// un check o agregás una serie y toda la vista se vuelve a dibujar, los bloques que ya se
// mostraron una vez no vuelven a animar — solo los nuevos (un día que todavía no viste).
const revealedBlocks = new Set();
let scrollRevealObserver = null;
function initScrollReveal(){
  if (scrollRevealObserver) { scrollRevealObserver.disconnect(); scrollRevealObserver = null; }
  const blocks = document.querySelectorAll("#view [data-reveal]");
  if (!blocks.length) return;
  const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduceMotion) { blocks.forEach(b=>b.classList.add("reveal-in")); return; }
  scrollRevealObserver = new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
      if (!entry.isIntersecting) return;
      entry.target.classList.add("reveal-in");
      revealedBlocks.add(entry.target.dataset.reveal);
      scrollRevealObserver.unobserve(entry.target);
    });
  }, { threshold: .12, rootMargin: "0px 0px -8% 0px" });
  blocks.forEach(b=>{
    if (revealedBlocks.has(b.dataset.reveal)) b.classList.add("reveal-in");
    else scrollRevealObserver.observe(b);
  });
}

// Reconecta el IntersectionObserver que da el efecto de foco de scroll en Entreno.
// Necesario en cada render porque renderApp() reconstruye toda la vista por innerHTML
// (incluso en toggles de OTROS ejercicios) — los nodos que observaba el anterior ya
// son basura, así que hay que desconectar y volver a observar los nuevos cada vez.
// rootMargin negativo en ambos lados deja solo una banda angosta en el centro vertical
// del viewport como área "activa": la card que la cruza queda enfocada, sin necesidad
// de calcular distancias por frame.
function setupExerciseFocus(){
  if(exerciseObserver){ exerciseObserver.disconnect(); exerciseObserver=null; }
  if(view!=="entreno") return;
  const reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(reduced) return;
  const nodes = document.querySelectorAll("#view .card, #view .ex-collapsed");
  if(!nodes.length) return;
  exerciseObserver = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{ entry.target.classList.toggle("ex-focused", entry.isIntersecting); });
  }, { root:null, rootMargin:"-45% 0px -45% 0px", threshold:0 });
  nodes.forEach(n=>exerciseObserver.observe(n));
}

// Hover-glow + ripple de los tabs de día (Torso/Piernas/…): el glow sigue el mouse vía
// --gx/--gy, el ripple es un span temporal por click. Delegado porque .tabs se recrea en cada render.
document.body.addEventListener("mousemove", e => {
  const t = e.target.closest(".tab"); if(!t) return;
  const r = t.getBoundingClientRect();
  t.style.setProperty("--gx", (e.clientX-r.left)+"px");
  t.style.setProperty("--gy", (e.clientY-r.top)+"px");
});
function tabRipple(btn, clientX, clientY){
  const rect = btn.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height) * 2.2;
  const x = (typeof clientX==="number" ? clientX : rect.left+rect.width/2) - rect.left - size/2;
  const y = (typeof clientY==="number" ? clientY : rect.top+rect.height/2) - rect.top - size/2;
  const span = document.createElement("span");
  span.className = "tab-ripple";
  span.style.width = span.style.height = size+"px";
  span.style.left = x+"px"; span.style.top = y+"px";
  btn.appendChild(span);
  setTimeout(()=>{ span.remove(); }, 520);
}

  else if (a === "clear") { d.exercises.forEach(x=>x.sets.forEach(s=>s.done=false)); }
  else return;
  save(); renderApp();
});

// ---- Fondo de partículas fluidas (FluidParticlesBackground, vanilla canvas — solo pantalla de login) ----
function auCreateNoise(){
  const permutation=[151,160,137,91,90,15,131,13,201,95,96,53,194,233,7,225,140,36,103,30,69,142,8,99,37,240,21,10,23,190,6,148,247,120,234,75,0,26,197,62,94,252,219,203,117,35,11,32,57,177,33,88,237,149,56,87,174,20,125,136,171,168,68,175,74,165,71,134,139,48,27,166,77,146,158,231,83,111,229,122,60,211,133,230,220,105,92,41,55,46,245,40,244,102,143,54,65,25,63,161,1,216,80,73,209,76,132,187,208,89,18,169,200,196,135,130,116,188,159,86,164,100,109,198,173,186,3,64,52,217,226,250,124,123,5,202,38,147,118,126,255,82,85,212,207,206,59,227,47,16,58,17,182,189,28,42,223,183,170,213,119,248,152,2,44,154,163,70,221,153,101,155,167,43,172,9,129,22,39,253,19,98,108,110,79,113,224,232,178,185,112,104,218,246,97,228,251,34,242,193,238,210,144,12,191,179,162,241,81,51,145,235,249,14,239,107,49,192,214,31,181,199,106,157,184,84,204,176,115,121,50,45,127,4,150,254,138,236,205,93,222,114,67,29,24,72,243,141,128,195,78,66,215,61,156,180];
  const p=new Array(512);
  for(let i=0;i<256;i++){ p[256+i]=p[i]=permutation[i]; }
  const fade=t=>t*t*t*(t*(t*6-15)+10);
  const lerp=(t,a,b)=>a+t*(b-a);
  const grad=(hash,x,y,z)=>{ const h=hash&15; const u=h<8?x:y; const v=h<4?y:(h===12||h===14?x:z); return ((h&1)===0?u:-u)+((h&2)===0?v:-v); };
  return { simplex3:(x,y,z)=>{
    const X=Math.floor(x)&255, Y=Math.floor(y)&255, Z=Math.floor(z)&255;
    x-=Math.floor(x); y-=Math.floor(y); z-=Math.floor(z);
    const u=fade(x), v=fade(y), w=fade(z);
    const A=p[X]+Y, AA=p[A]+Z, AB=p[A+1]+Z, B=p[X+1]+Y, BA=p[B]+Z, BB=p[B+1]+Z;
    return lerp(w, lerp(v, lerp(u,grad(p[AA],x,y,z),grad(p[BA],x-1,y,z)), lerp(u,grad(p[AB],x,y-1,z),grad(p[BB],x-1,y-1,z))),
                   lerp(v, lerp(u,grad(p[AA+1],x,y,z-1),grad(p[BA+1],x-1,y,z-1)), lerp(u,grad(p[AB+1],x,y-1,z-1),grad(p[BB+1],x-1,y-1,z-1))));
  }};
}
let authParticlesHandle=null;
function stopAuthParticles(){ if(authParticlesHandle){ try{ authParticlesHandle.stop(); }catch(e){} authParticlesHandle=null; } }
function startAuthParticles(canvas){
  stopAuthParticles();
  if(!canvas) return;
  const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const ctx = canvas.getContext("2d",{alpha:true}); if(!ctx) return;
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  function resize(){
    const w=canvas.parentElement.clientWidth, h=canvas.parentElement.clientHeight;
    canvas.width=Math.max(1,Math.round(w*dpr)); canvas.height=Math.max(1,Math.round(h*dpr));
    canvas.style.width=w+"px"; canvas.style.height=h+"px";
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  resize();
  const w0=window.innerWidth;
  const count = w0<560 ? 90 : (w0<1000 ? 170 : 260); // menos partículas en mobile: rendimiento
  const noise = auCreateNoise();
  const particles = Array.from({length:count}, ()=>({
    x:Math.random()*canvas.clientWidth, y:Math.random()*canvas.clientHeight,
    size:Math.random()*1.6+0.6, life:Math.random()*100, maxLife:140+Math.random()*90
  }));
  let raf=null, stopped=false;
  function frame(){
    if(stopped) return;
    const w=canvas.clientWidth, h=canvas.clientHeight;
    ctx.clearRect(0,0,w,h);
    for(const p of particles){
      p.life+=1;
      if(p.life>p.maxLife){ p.life=0; p.x=Math.random()*w; p.y=Math.random()*h; }
      const op=Math.sin((p.life/p.maxLife)*Math.PI)*0.55;
      const n=noise.simplex3(p.x*0.0025, p.y*0.0025, Date.now()*0.00008);
      const angle=n*Math.PI*4;
      p.x+=Math.cos(angle)*0.55; p.y+=Math.sin(angle)*0.55;
      if(p.x<0) p.x=w; if(p.x>w) p.x=0; if(p.y<0) p.y=h; if(p.y>h) p.y=0;
      ctx.fillStyle="rgba(150,224,181,"+Math.max(0,op*0.6).toFixed(3)+")";
      ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill();
    }
    raf=requestAnimationFrame(frame);
  }
  if(!reduceMotion) frame(); // respeta prefers-reduced-motion: sin loop, queda solo el fondo estático
  function onResize(){ resize(); }
  window.addEventListener("resize", onResize);
  authParticlesHandle = { stop(){ stopped=true; if(raf) cancelAnimationFrame(raf); window.removeEventListener("resize", onResize); } };
}

// ============ Fondo de partículas (Entreno/Hábitos/Cardio/Comida/Progreso) ============
// Mismo componente que el login (FluidParticlesBackground): ruido Simplex + partículas
// finas a la deriva sobre el degradé oscuro de marca. Reutiliza auCreateNoise().
// Se muestra/oculta con showSilkBg()/hideSilkBg(); nunca se recrea.
let silkCtx=null, silkCanvasEl=null, silkRafId=null, silkParticles=[], silkNoise=null;
let silkVisible=false, silkInited=false;

function silkReducedMotion(){ return !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches); }

function silkMakeParticles(w, h){
  const count = w<560 ? 90 : (w<1000 ? 170 : 260); // misma escala adaptativa que el login
  return Array.from({length:count}, () => ({
    x: Math.random()*w, y: Math.random()*h,
    size: Math.random()*1.6+0.6, life: Math.random()*100, maxLife: 140+Math.random()*90
  }));
}

function initSilk(){
  if(silkInited) return; silkInited = true;
  silkCanvasEl = document.getElementById("silkCanvas"); if(!silkCanvasEl) return;
  try { silkCtx = silkCanvasEl.getContext("2d", {alpha:true}); } catch(e){}
  if(!silkCtx) return; // sin canvas 2D disponible: el fondo simplemente no aparece, no rompe nada
  silkNoise = auCreateNoise();
  silkResize();
  window.addEventListener("resize", silkResize);
  document.addEventListener("visibilitychange", silkOnVisibilityChange);
  silkLoop();
}

function silkResize(){
  if(!silkCanvasEl || !silkCtx) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = window.innerWidth, h = window.innerHeight;
  silkCanvasEl.width = Math.max(1, Math.round(w*dpr));
  silkCanvasEl.height = Math.max(1, Math.round(h*dpr));
  silkCanvasEl.style.width = w+"px"; silkCanvasEl.style.height = h+"px";
  silkCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  silkParticles = silkMakeParticles(w, h);
}

function silkLoop(){
  if(document.visibilityState!=="visible" || !silkVisible){ silkRafId=null; return; } // pausa real: no seguimos pidiendo frames
  silkRafId = requestAnimationFrame(silkLoop);
  if(!silkCtx || !silkCanvasEl || !silkNoise) return;
  const w = silkCanvasEl.clientWidth || window.innerWidth;
  const h = silkCanvasEl.clientHeight || window.innerHeight;
  const speedFactor = silkReducedMotion() ? 0.12 : 1; // reduced motion: movimiento muy reducido, no estático
  silkCtx.clearRect(0, 0, w, h);
  for(const p of silkParticles){
    p.life += 1;
    if(p.life>p.maxLife){ p.life=0; p.x=Math.random()*w; p.y=Math.random()*h; }
    const op = Math.sin((p.life/p.maxLife)*Math.PI)*0.55;
    const n = silkNoise.simplex3(p.x*0.0025, p.y*0.0025, Date.now()*0.00008);
    const angle = n*Math.PI*4;
    p.x += Math.cos(angle)*0.55*speedFactor; p.y += Math.sin(angle)*0.55*speedFactor;
    if(p.x<0) p.x=w; if(p.x>w) p.x=0; if(p.y<0) p.y=h; if(p.y>h) p.y=0;
    silkCtx.fillStyle = "rgba(150,224,181,"+Math.max(0,op*0.6).toFixed(3)+")";
    silkCtx.beginPath(); silkCtx.arc(p.x,p.y,p.size,0,Math.PI*2); silkCtx.fill();
  }
}

function silkOnVisibilityChange(){
  if(document.visibilityState==="visible" && silkVisible && silkRafId==null) silkLoop();
}

function showSilkBg(){
  if(!silkInited) initSilk();
  silkVisible = true;
  const c=document.getElementById("silkCanvas");
  if(c) c.classList.add("on");
  document.body.classList.add("silk-on");
  if(silkRafId==null) silkLoop();
}
function hideSilkBg(){
  silkVisible = false;
  const c=document.getElementById("silkCanvas");
  if(c) c.classList.remove("on");
  document.body.classList.remove("silk-on");
  document.body.classList.remove("silk-coach");
}

function coachExercises(sessions){ const m={}; (sessions||[]).forEach(se=>se.exercises.forEach(ex=>{ if(ex.name) m[ex.name]=1; })); return Object.keys(m).sort((a,b)=>a.localeCompare(b,"es")); }
function coachSeries(sessions,name){ const out=[]; (sessions||[]).slice().sort((a,b)=>(a.ts||0)-(b.ts||0)).forEach(se=>{ let mx=0; se.exercises.forEach(ex=>{ if(ex.name===name) ex.sets.forEach(x=>{ const k=+x.kg||0; if(k>mx) mx=k; }); }); if(mx>0) out.push({date:se.date, kg:mx}); }); return out; }
function coachLogFor(sessions, dayName, name){
  const out=[];
  (sessions||[]).slice().sort((a,b)=>(b.ts||0)-(a.ts||0)).forEach(se=>{
    if(dayName && se.day && se.day!==dayName) return;
    const sets=[];
    se.exercises.forEach(ex=>{ if(ex.name===name) ex.sets.forEach(st=>{ if((+st.kg||0)>0||(+st.reps||0)>0) sets.push({kg:+st.kg||0, reps:+st.reps||0}); }); });
    if(sets.length) out.push({date:se.date, ts:se.ts, sets:sets});
  });
  return out;
}
function coachExerciseLog(sessions,name){ const out=[]; (sessions||[]).slice().sort((a,b)=>(a.ts||0)-(b.ts||0)).forEach(se=>{ const sets=[]; se.exercises.forEach(ex=>{ if(ex.name===name) ex.sets.forEach(st=>{ if((+st.kg||0)>0||(+st.reps||0)>0) sets.push({kg:+st.kg||0, reps:+st.reps||0}); }); }); if(sets.length) out.push({date:se.date, ts:se.ts, sets:sets}); }); return out; }

function exTable(d, dayName, exName){

  if(!log.length) return "";
  let maxS=1; log.forEach(e=>{ if(e.sets.length>maxS) maxS=e.sets.length; });
  const th=['<th>Fecha</th>']; for(let i=0;i<maxS;i++) th.push('<th>Serie '+(i+1)+'</th>'); th.push('<th class="mx">M\u00e1x</th>');
  const rows=log.slice(0,8).map(e=>{
    const tds=['<td class="dt">'+fmtDate(e.date)+'</td>'];

      if(!st) tds.push('<td class="em">\u2014</td>');
      else { const kg=+st.kg||0, rp=+st.reps||0; tds.push('<td>'+(kg>0?(Math.round(kg*10)/10)+' kg':'\u2014')+(rp>0?' <span class="rp">\u00d7 '+rp+'</span>':'')+'</td>'); }

  const mm=(muscleOf(name)!=="otros")?muscleOf(name):(coachPCat||"otros");

  if(a==="pl-habitdel"){ const p=coachPlanObj(coachData); p.habits.splice(+b.dataset.i,1); renderCoach(); return; }
