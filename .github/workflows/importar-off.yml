# Suma a la base compartida de GIZE (tabla products) los productos argentinos de
# Open Food Facts que tienen la tabla nutricional completa (ver scripts/importar-off.mjs).
# No pisa lo que cargaron los usuarios ni lo que se revisó a mano en el panel.
# Se corre a mano (Actions → "Importar Open Food Facts" → Run workflow) y solo una vez por mes
# para traer lo nuevo. Antes de la primera vez: tarea "sql" de Supabase con supabase/productos-off.sql.
#
# Usa el secret SUPABASE_ACCESS_TOKEN (el mismo del workflow "Supabase").
# El log es PÚBLICO: el script imprime solo cantidades.
name: Importar Open Food Facts

on:
  workflow_dispatch:
    inputs:
      paginas:
        description: "Tope de páginas de 100 productos (800 = todas)"
        required: false
        default: "800"
  schedule:
    - cron: "17 6 3 * *"

permissions:
  contents: read

concurrency:
  group: importar-off
  cancel-in-progress: false

jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Importar
        env:
          PROJECT_REF: wegptuzhsrwppbknqstf
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PAGINAS: ${{ inputs.paginas || '800' }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::error::Falta el secret SUPABASE_ACCESS_TOKEN"; exit 1; fi
          case "$PAGINAS" in ''|*[!0-9]*) echo "::error::Páginas tiene que ser un número"; exit 1;; esac
          node scripts/importar-off.mjs --apply --max-pages "$PAGINAS"
